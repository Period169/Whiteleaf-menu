<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>White Leaf 接单后台</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --cream: #f5f2ec;
  --green-dark: #2d4a3e;
  --green-mid: #6b8f71;
  --green-light: #a8c5a0;
  --charcoal: #1a1a1a;
  --warm-gray: #8a8680;
  --accent: #c4a882;
}

html, body {
  background: #edeae3;
  font-family: 'Noto Sans SC', sans-serif;
  font-weight: 300;
  min-height: 100vh;
}

/* ─── TOP BAR ──────────────────────────────────────────── */
.topbar {
  background: var(--green-dark);
  padding: 0 20px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,0.2);
}
.topbar-logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-weight: 300;
  color: var(--cream);
  letter-spacing: 0.08em;
}
.topbar-sub {
  font-size: 10px;
  color: var(--green-light);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-top: 2px;
}
.topbar-right {
  display: flex;
  align-items: center;
  gap: 10px;
}
.pending-badge {
  background: var(--accent);
  color: var(--green-dark);
  font-size: 12px;
  font-weight: 500;
  padding: 4px 12px;
  border-radius: 20px;
  display: none;
}
.pending-badge.show { display: block; }
.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #2ecc71;
  box-shadow: 0 0 8px #2ecc71;
  animation: pulse-dot 2s infinite;
}
.status-dot.offline {
  background: #e74c3c;
  box-shadow: 0 0 8px #e74c3c;
  animation: none;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ─── MAIN ─────────────────────────────────────────────── */
.main {
  padding: 16px 16px 100px;
  max-width: 720px;
  margin: 0 auto;
}
.section-label {
  font-size: 10px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--warm-gray);
  margin: 20px 0 12px 4px;
}

/* ─── ORDER CARD ───────────────────────────────────────── */
.order-card {
  background: #fff;
  border-radius: 16px;
  padding: 18px 20px;
  margin-bottom: 14px;
  box-shadow: 0 2px 16px rgba(0,0,0,0.07);
  border-left: 5px solid var(--green-dark);
  animation: slideIn 0.3s ease both;
  position: relative;
  overflow: hidden;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(-8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Status border colors */
.s-pending_confirm {
  border-left-color: var(--accent);
  box-shadow: 0 4px 24px rgba(196,168,130,0.2);
}
.s-pending_confirm::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--green-mid), var(--accent));
  background-size: 200%;
  animation: shimmer 1.5s infinite;
}
@keyframes shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
.s-accepted  { border-left-color: var(--green-dark); }
.s-preparing { border-left-color: var(--green-mid); }
.s-ready {
  border-left-color: #27ae60;
  box-shadow: 0 4px 20px rgba(39,174,96,0.15);
}
.s-ready::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 3px;
  background: #27ae60;
  animation: pulse-bar 1s infinite;
}
@keyframes pulse-bar {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.25; }
}
.s-completed { border-left-color: var(--green-light); opacity: 0.65; }
.s-cancelled { border-left-color: #ddd; opacity: 0.5; }

/* ─── CARD HEADER ──────────────────────────────────────── */
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 14px;
}
.order-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: 30px;
  color: var(--green-dark);
  line-height: 1;
}
.order-meta {
  font-size: 11px;
  color: var(--warm-gray);
  margin-top: 4px;
  line-height: 1.7;
}
.order-total {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  color: var(--green-dark);
  text-align: right;
}
.pay-method {
  font-size: 10px;
  color: var(--warm-gray);
  text-align: right;
  margin-top: 3px;
  letter-spacing: 0.05em;
}

/* Status tag */
.status-tag {
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 10px;
  display: inline-block;
  margin-top: 5px;
}
.tag-new       { color: var(--accent);    background: rgba(196,168,130,0.12); border: 1px solid rgba(196,168,130,0.3); }
.tag-accepted  { color: var(--green-dark); background: rgba(45,74,62,0.08);    border: 1px solid rgba(45,74,62,0.2); }
.tag-preparing { color: var(--green-mid);  background: rgba(107,143,113,0.1);  border: 1px solid rgba(107,143,113,0.25); }
.tag-ready     { color: #27ae60;           background: rgba(39,174,96,0.08);   border: 1px solid rgba(39,174,96,0.25); }
.tag-completed { color: var(--warm-gray);  background: rgba(0,0,0,0.04);       border: 1px solid #ddd; }
.tag-cancelled { color: #bbb;              background: rgba(0,0,0,0.03);       border: 1px solid #eee; }

/* ─── ITEMS TABLE ──────────────────────────────────────── */
.items-block {
  background: #f8f7f4;
  border-radius: 10px;
  padding: 10px 14px;
  margin-bottom: 12px;
}
.item-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  padding: 7px 0;
  border-bottom: 1px solid rgba(0,0,0,0.05);
}
.item-row:last-child { border-bottom: none; }
.item-left { flex: 1; }
.item-name {
  font-size: 14px;
  color: var(--charcoal);
  font-weight: 400;
}
.item-detail {
  font-size: 11px;
  color: var(--warm-gray);
  margin-top: 2px;
  line-height: 1.5;
}
.item-price {
  font-size: 13px;
  color: var(--green-dark);
  white-space: nowrap;
}

/* Toppings */
.toppings-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 10px;
}
.topping-chip {
  font-size: 11px;
  color: var(--warm-gray);
  background: rgba(107,143,113,0.08);
  border: 1px solid rgba(107,143,113,0.2);
  padding: 3px 10px;
  border-radius: 20px;
}

/* Notes */
.notes-row {
  font-size: 12px;
  color: var(--warm-gray);
  background: #fff8f0;
  border: 1px solid rgba(196,168,130,0.3);
  border-radius: 8px;
  padding: 8px 12px;
  margin-bottom: 12px;
  font-style: italic;
}

/* ─── ACTION BUTTONS ───────────────────────────────────── */
.btn-row {
  display: flex;
  gap: 8px;
}
.btn-primary {
  flex: 2;
  background: var(--green-dark);
  color: var(--cream);
  border: none;
  border-radius: 10px;
  padding: 13px;
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 14px;
  font-weight: 400;
  letter-spacing: 0.05em;
  cursor: pointer;
  transition: background 0.15s, opacity 0.15s;
}
.btn-primary:active  { background: #1e3329; }
.btn-primary:disabled { opacity: 0.5; pointer-events: none; }
.btn-primary.green   { background: #27ae60; }
.btn-primary.green:active { background: #1e8449; }
.btn-secondary {
  flex: 1;
  background: transparent;
  color: var(--warm-gray);
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 13px;
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 14px;
  cursor: pointer;
  transition: background 0.15s;
}
.btn-secondary:active { background: #f5f5f5; }

/* ─── EMPTY ────────────────────────────────────────────── */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--warm-gray);
}
.empty-icon { font-size: 44px; margin-bottom: 14px; opacity: 0.4; }
.empty-text { font-size: 13px; letter-spacing: 0.05em; }

/* ─── BOTTOM NAV ───────────────────────────────────────── */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--green-dark);
  display: flex;
  padding: 10px 20px 28px;
  gap: 10px;
  z-index: 100;
}
.nav-btn {
  flex: 1;
  background: rgba(255,255,255,0.1);
  color: var(--cream);
  border: none;
  border-radius: 10px;
  padding: 10px;
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 12px;
  letter-spacing: 0.05em;
  cursor: pointer;
  opacity: 0.6;
  transition: all 0.2s;
}
.nav-btn.active { background: rgba(255,255,255,0.18); opacity: 1; }

/* ─── VIEW TOGGLE ──────────────────────────────────────── */
.view-active  { display: block; }
.view-history { display: none; }
.view-stats   { display: none; }
body.show-history .view-active  { display: none; }
body.show-history .view-history { display: block; }
body.show-stats   .view-active  { display: none; }
body.show-stats   .view-stats   { display: block; }

/* ─── STATS DETAIL ─────────────────────────────────────── */
.stats-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 20px 16px; padding: 4px 0 8px;
}
.stats-grid-item { text-align: center; }
.stats-grid-val {
  font-family: 'Cormorant Garamond', serif;
  font-size: 34px; color: var(--green-dark); line-height: 1;
}
.stats-grid-label {
  font-size: 9px; color: var(--warm-gray);
  letter-spacing: 0.12em; text-transform: uppercase; margin-top: 4px;
}
.top-drink-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 0; border-bottom: 1px solid rgba(0,0,0,0.05);
}
.top-drink-row:last-child { border-bottom: none; }
.top-drink-rank { font-size: 18px; margin-right: 10px; }
.top-drink-name { flex: 1; font-size: 13px; color: var(--charcoal); }
.top-drink-count {
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px; color: var(--green-dark);
}

/* ─── DATE GROUP ───────────────────────────────────────── */
.date-header {
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--warm-gray);
  margin: 20px 0 10px 4px;
}

/* ─── STUDENT DISCOUNT ─────────────────────────────────── */
.student-disc-row {
  font-size: 12px;
  color: var(--green-mid);
  padding: 4px 0 8px;
  letter-spacing: 0.02em;
}

/* ─── PRINT BUTTON ────────────────────────────────────── */
.btn-print {
  background: transparent;
  color: var(--warm-gray);
  border: 1px solid #e0ddd8;
  border-radius: 8px;
  padding: 7px 14px;
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 12px;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: background 0.15s;
  margin-top: 10px;
  display: block;
  width: 100%;
}
.btn-print:active { background: #f0ece6; }

/* ─── PIN SCREEN ────────────────────────────────────────── */
#pin-screen {
  position: fixed; inset: 0;
  background: var(--green-dark);
  z-index: 1000;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}
#pin-screen.hidden { display: none; }
.pin-logo { font-family: 'Cormorant Garamond', serif; font-size: 32px; color: var(--cream); letter-spacing: 0.1em; margin-bottom: 4px; }
.pin-sub  { font-size: 10px; color: var(--green-light); letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 36px; }
.pin-input {
  width: 180px; padding: 14px 16px;
  border: 1px solid rgba(255,255,255,0.2); border-radius: 10px;
  background: rgba(255,255,255,0.08); color: var(--cream);
  font-size: 24px; text-align: center; letter-spacing: 6px;
  outline: none; font-family: monospace; margin-bottom: 14px;
  -webkit-text-security: disc; type: password;
}
.pin-input::placeholder { letter-spacing: 2px; font-size: 13px; color: rgba(255,255,255,0.3); }
.pin-btn {
  width: 180px; padding: 14px;
  background: var(--accent); color: var(--green-dark);
  border: none; border-radius: 10px;
  font-family: 'Noto Sans SC', sans-serif; font-size: 14px; font-weight: 500;
  cursor: pointer; transition: opacity 0.2s;
}
.pin-btn:active { opacity: 0.8; }
.pin-error { font-size: 12px; color: #e74c3c; margin-top: 12px; height: 18px; }
.logout-btn {
  font-size: 11px; color: rgba(255,255,255,0.55);
  background: transparent; border: 1px solid rgba(255,255,255,0.2);
  border-radius: 8px; padding: 5px 12px; cursor: pointer;
  font-family: 'Noto Sans SC', sans-serif; transition: opacity 0.2s;
}
.logout-btn:active { opacity: 0.6; }

/* ─── STATS BAR ─────────────────────────────────────────── */
.stats-bar {
  background: rgba(45,74,62,0.92);
  display: flex; justify-content: space-around;
  padding: 10px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  gap: 0;
}
.stat-item { flex: 1; text-align: center; border-right: 1px solid rgba(255,255,255,0.1); padding: 2px 6px; }
.stat-item:last-child { border-right: none; }
.stat-value { font-family: 'Cormorant Garamond', serif; font-size: 16px; color: var(--cream); line-height: 1; margin-bottom: 3px; }
.stat-label { font-size: 9px; color: var(--green-light); letter-spacing: 0.12em; text-transform: uppercase; }

/* ─── CANCEL MODAL ──────────────────────────────────────── */
#cancel-modal {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.5); z-index: 200;
  align-items: center; justify-content: center; padding: 20px;
}
#cancel-modal.show { display: flex; }
.cancel-card {
  background: #fff; border-radius: 16px; padding: 24px;
  width: 100%; max-width: 340px;
  animation: popIn 0.25s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes popIn {
  from { opacity: 0; transform: scale(0.9); }
  to   { opacity: 1; transform: scale(1); }
}
.cancel-title { font-family: 'Cormorant Garamond', serif; font-size: 20px; color: var(--green-dark); margin-bottom: 16px; }
.cancel-option {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
  border: 1px solid rgba(107,143,113,0.2); border-radius: 8px;
  margin-bottom: 8px; cursor: pointer;
  font-size: 14px; color: var(--charcoal);
  transition: border-color 0.15s;
}
.cancel-option:hover { border-color: var(--green-dark); background: rgba(45,74,62,0.04); }
.cancel-option input[type="radio"] { accent-color: var(--green-dark); width: 16px; height: 16px; flex-shrink: 0; }
.cancel-reason-tag {
  display: inline-block; font-size: 11px;
  color: #c0392b; background: rgba(192,57,43,0.06);
  border: 1px solid rgba(192,57,43,0.18);
  padding: 2px 8px; border-radius: 8px; margin-top: 5px;
}

/* ─── TOAST ────────────────────────────────────────────── */
#toast {
  position: fixed;
  top: 68px; left: 50%;
  transform: translateX(-50%);
  background: var(--green-dark);
  color: var(--cream);
  padding: 10px 24px;
  border-radius: 20px;
  font-size: 13px;
  z-index: 300;
  opacity: 0;
  transition: opacity 0.4s;
  letter-spacing: 0.05em;
  pointer-events: none;
  white-space: nowrap;
}
</style>
</head>
<body>

<!-- PIN SCREEN -->
<div id="pin-screen">
  <div class="pin-logo">White Leaf</div>
  <div class="pin-sub">Admin Access</div>
  <input class="pin-input" id="pin-input" type="password" inputmode="numeric"
         placeholder="PIN 码" maxlength="8" autocomplete="off">
  <button class="pin-btn" id="pin-btn" onclick="doLogin()">进入后台</button>
  <div class="pin-error" id="pin-error"></div>
</div>

<!-- TOP BAR -->
<div class="topbar">
  <div>
    <div class="topbar-logo">White Leaf</div>
    <div class="topbar-sub">接单后台</div>
  </div>
  <div class="topbar-right">
    <div class="pending-badge" id="pending-badge"></div>
    <div class="status-dot" id="status-dot"></div>
    <button class="logout-btn" onclick="doLogout()">退出</button>
  </div>
</div>

<!-- STATS BAR -->
<div class="stats-bar">
  <div class="stat-item">
    <div class="stat-value" id="stat-orders">—</div>
    <div class="stat-label">今日订单</div>
  </div>
  <div class="stat-item">
    <div class="stat-value" id="stat-revenue">—</div>
    <div class="stat-label">营业额 Ft</div>
  </div>
  <div class="stat-item">
    <div class="stat-value" id="stat-avg">—</div>
    <div class="stat-label">均单价 Ft</div>
  </div>
  <div class="stat-item">
    <div class="stat-value" id="stat-student">—</div>
    <div class="stat-label">学生优惠</div>
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <div class="view-active">
    <div class="section-label">进行中</div>
    <div id="active-list">
      <div class="empty-state">
        <div class="empty-icon">☕</div>
        <div class="empty-text">暂无订单</div>
      </div>
    </div>
  </div>
  <div class="view-history">
    <div class="section-label">历史记录</div>
    <div id="history-list">
      <div class="empty-state">
        <div class="empty-icon">📋</div>
        <div class="empty-text">暂无记录</div>
      </div>
    </div>
  </div>
  <div class="view-stats">
    <div class="section-label">今日统计</div>
    <div id="stats-detail">
      <div class="empty-state">
        <div class="empty-icon">📊</div>
        <div class="empty-text">加载中…</div>
      </div>
    </div>
  </div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <button class="nav-btn active" id="nav-active"  onclick="showView('active')">📋 进行中</button>
  <button class="nav-btn"        id="nav-history" onclick="showView('history')">📜 历史</button>
  <button class="nav-btn"        id="nav-stats"   onclick="showView('stats')">📊 统计</button>
</div>

<div id="toast"></div>

<!-- CANCEL MODAL -->
<div id="cancel-modal">
  <div class="cancel-card">
    <div class="cancel-title">取消原因</div>
    <label class="cancel-option"><input type="radio" name="cancel-reason" value="缺货"> 缺货</label>
    <label class="cancel-option"><input type="radio" name="cancel-reason" value="顾客取消"> 顾客取消</label>
    <label class="cancel-option"><input type="radio" name="cancel-reason" value="重复订单"> 重复订单</label>
    <label class="cancel-option"><input type="radio" name="cancel-reason" value="测试订单"> 测试订单</label>
    <label class="cancel-option"><input type="radio" name="cancel-reason" value="其他"> 其他</label>
    <div class="btn-row" style="margin-top:16px">
      <button class="btn-primary" style="background:#c0392b" onclick="confirmCancel()">确认取消</button>
      <button class="btn-secondary" onclick="closeCancelModal()">返回</button>
    </div>
  </div>
</div>

<script>
var API           = 'https://whiteleaf-backend-production.up.railway.app';
var POLL_INTERVAL = 10000;
var adminToken    = localStorage.getItem('wl_admin_token') || '';
var pollInterval  = null;
var statsInterval = null;

var ACTIVE_STATUSES = ['pending_confirm', 'pending_payment', 'accepted', 'preparing', 'ready'];

var STATUS_LABELS = {
  pending_confirm:  '新订单',
  pending_payment:  '待付款',
  accepted:         '制作中',   // legacy — treated same as preparing
  preparing:        '制作中',
  ready:            '已备好',
  completed:        '已完成',
  cancelled:        '已取消'
};

var STATUS_TAG_CLASS = {
  pending_confirm:  'tag-new',
  pending_payment:  'tag-new',
  accepted:         'tag-preparing',
  preparing:        'tag-preparing',
  ready:            'tag-ready',
  completed:        'tag-completed',
  cancelled:        'tag-cancelled'
};

var PAY_LABELS = {
  counter: '柜台支付',
  online:  '在线支付'
};

var activeOrders  = [];
var historyOrders = [];
var ordersById    = {};
var seenIds       = new Set();
var isFirstLoad   = true;
var audioCtx      = null;

// ── AUDIO ─────────────────────────────────────────────────
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playAlert() {
  try {
    initAudio();
    var notes = [523, 659, 784, 1047];
    for (var i = 0; i < notes.length; i++) {
      (function(freq, idx) {
        var osc  = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = freq;
        osc.type = 'sine';
        var t = audioCtx.currentTime + idx * 0.15;
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.3, t + 0.05);
        gain.gain.linearRampToValueAtTime(0, t + 0.25);
        osc.start(t);
        osc.stop(t + 0.3);
      })(notes[i], i);
    }
  } catch(e) {}
}

// ── FETCH ─────────────────────────────────────────────────
async function fetchOrders() {
  try {
    var res = await fetch(API + '/api/admin/orders', {
      headers: { 'Authorization': 'Bearer ' + adminToken }
    });
    if (res.status === 401 || res.status === 403) { doLogout(); return; }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var orders = await res.json();
    processOrders(orders);
    setOnline(true);
  } catch(e) {
    setOnline(false);
  }
}

function processOrders(orders) {
  var newActive  = [];
  var newHistory = [];
  var newOnes    = [];

  for (var i = 0; i < orders.length; i++) {
    var o = orders[i];
    if (ACTIVE_STATUSES.indexOf(o.status) >= 0) {
      newActive.push(o);
      if (!isFirstLoad && o.status === 'pending_confirm' && !seenIds.has(o.id)) {
        newOnes.push(o);
      }
    } else {
      newHistory.push(o);
    }
    seenIds.add(o.id);
    ordersById[o.id] = o;
  }

  // Sort active: oldest first (顶部最老的待处理订单)
  newActive.sort(function(a, b) { return new Date(a.created_at) - new Date(b.created_at); });
  // Sort history: newest first
  newHistory.sort(function(a, b) { return new Date(b.created_at) - new Date(a.created_at); });

  if (newOnes.length > 0) {
    playAlert();
    showToast('新订单 ×' + newOnes.length);
  }

  activeOrders  = newActive;
  historyOrders = newHistory;
  isFirstLoad   = false;

  renderActive();
  renderHistory();
  updateBadge();
}

// ── CANCEL MODAL ──────────────────────────────────────────
var cancelTargetId = null;

function cancelOrder(orderId) {
  cancelTargetId = orderId;
  document.querySelectorAll('#cancel-modal input[name="cancel-reason"]').forEach(function(r) { r.checked = false; });
  document.getElementById('cancel-modal').classList.add('show');
}

function closeCancelModal() {
  document.getElementById('cancel-modal').classList.remove('show');
  cancelTargetId = null;
}

async function confirmCancel() {
  var selected = document.querySelector('#cancel-modal input[name="cancel-reason"]:checked');
  if (!selected) { showToast('请选择取消原因'); return; }
  var reason = selected.value;
  closeCancelModal();
  await updateStatus(cancelTargetId, 'cancelled', reason);
}

// ── STATUS UPDATE ──────────────────────────────────────────
async function updateStatus(orderId, newStatus, cancelReason) {
  var btns = document.querySelectorAll('[data-oid="' + orderId + '"]');
  for (var i = 0; i < btns.length; i++) btns[i].disabled = true;

  try {
    var body = { status: newStatus };
    if (cancelReason) body.cancelReason = cancelReason;
    var res = await fetch(API + '/api/admin/orders/' + orderId + '/status', {
      method: 'PATCH',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + adminToken
      },
      body: JSON.stringify(body)
    });
    if (res.status === 401 || res.status === 403) { doLogout(); return; }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    await fetchOrders();
  } catch(e) {
    showToast('更新失败，请重试');
    for (var j = 0; j < btns.length; j++) btns[j].disabled = false;
  }
}

// ── RENDER ────────────────────────────────────────────────
function renderActive() {
  var el = document.getElementById('active-list');
  if (activeOrders.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">☕</div><div class="empty-text">暂无进行中订单</div></div>';
    return;
  }
  el.innerHTML = '';
  for (var i = 0; i < activeOrders.length; i++) {
    el.appendChild(makeCard(activeOrders[i], true));
  }
}

function renderHistory() {
  var el = document.getElementById('history-list');
  if (historyOrders.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">暂无记录</div></div>';
    return;
  }
  el.innerHTML = '';

  var groups    = {};
  var groupKeys = [];
  for (var i = 0; i < historyOrders.length; i++) {
    var o = historyOrders[i];
    var d = new Date(o.created_at);
    var key = d.getFullYear() + '/' + pad2(d.getMonth() + 1) + '/' + pad2(d.getDate());
    if (!groups[key]) { groups[key] = []; groupKeys.push(key); }
    groups[key].push(o);
  }

  for (var k = 0; k < groupKeys.length; k++) {
    var dateStr = groupKeys[k];
    var header  = document.createElement('div');
    header.className   = 'date-header';
    header.textContent = dateStr;
    el.appendChild(header);
    for (var j = 0; j < groups[dateStr].length; j++) {
      el.appendChild(makeCard(groups[dateStr][j], false));
    }
  }
}

function makeCard(order, isActive) {
  var card = document.createElement('div');
  var statusCls = (order.status === 'pending_confirm' || order.status === 'pending_payment') ? 'pending_confirm' : order.status;
  card.className = 'order-card s-' + statusCls;

  // Time
  var d    = new Date(order.created_at);
  var time = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  var date = pad2(d.getMonth() + 1) + '/' + pad2(d.getDate());

  // Status tag
  var tagCls   = STATUS_TAG_CLASS[order.status] || 'tag-completed';
  var tagLabel = STATUS_LABELS[order.status]    || order.status;

  // Items
  var BASE_NAMES = { pearl: 'Tapioca Pearls', coconut: 'Coconut Jelly', boba: 'Popping Boba' };
  var items    = order.order_items || [];
  var itemsHtml = '';
  for (var i = 0; i < items.length; i++) {
    var item    = items[i];
    var details = [];
    if (item.size)        details.push(item.size);
    if (item.base_choice) details.push(BASE_NAMES[item.base_choice] || item.base_choice);
    if (item.sweetness)   details.push(item.sweetness);
    if (item.ice)         details.push(item.ice);
    var qtyPrefix = item.quantity > 1 ? '×' + item.quantity + '  ' : '';
    itemsHtml +=
      '<div class="item-row">' +
        '<div class="item-left">' +
          '<div class="item-name">' + escHtml(qtyPrefix + item.product_name) + '</div>' +
          (details.length ? '<div class="item-detail">' + escHtml(details.join(' · ')) + '</div>' : '') +
        '</div>' +
        '<div class="item-price">' + item.total_price.toLocaleString() + ' Ft</div>' +
      '</div>';
  }

  // Toppings
  var toppings    = order.order_toppings || [];
  var toppingsHtml = '';
  if (toppings.length > 0) {
    toppingsHtml = '<div class="toppings-row">';
    for (var t = 0; t < toppings.length; t++) {
      var tp = toppings[t];
      toppingsHtml += '<span class="topping-chip">+ ' + escHtml(tp.topping_name) +
        (tp.price ? ' ' + tp.price + ' Ft' : '') + '</span>';
    }
    toppingsHtml += '</div>';
  }

  // Student discount
  var studentDiscHtml = order.student_discount
    ? '<div class="student-disc-row">Student discount  −200 Ft</div>' : '';

  // Notes
  var notesHtml = (order.notes && order.notes.trim())
    ? '<div class="notes-row">备注：' + escHtml(order.notes) + '</div>' : '';

  // Cancel reason
  var cancelReasonHtml = (order.status === 'cancelled' && order.cancel_reason)
    ? '<div style="margin-bottom:8px"><span class="cancel-reason-tag">取消原因：' + escHtml(order.cancel_reason) + '</span></div>' : '';

  // Member / contact
  var memberHtml = '';
  if (order.member_id) {
    memberHtml = '会员';
  }

  // Action buttons
  var btnsHtml = '';
  if (isActive) {
    var oid = order.id;
    if (order.status === 'pending_confirm') {
      btnsHtml = '<div class="btn-row">' +
        '<button class="btn-primary" data-oid="' + oid + '" onclick="updateStatus(\'' + oid + '\',\'preparing\')">▶ 开始制作</button>' +
        '<button class="btn-secondary" data-oid="' + oid + '" onclick="cancelOrder(\'' + oid + '\')">取消</button>' +
        '</div>';
    } else if (order.status === 'pending_payment') {
      btnsHtml = '<div class="btn-row">' +
        '<button class="btn-secondary" style="flex:2;color:#c0392b;border-color:#c0392b" data-oid="' + oid + '" onclick="cancelOrder(\'' + oid + '\')">取消订单</button>' +
        '</div>';
    } else if (order.status === 'accepted' || order.status === 'preparing') {
      // accepted = legacy DB value, treat same as preparing
      btnsHtml = '<div class="btn-row">' +
        '<button class="btn-primary green" data-oid="' + oid + '" onclick="updateStatus(\'' + oid + '\',\'ready\')">🔔 已备好</button>' +
        '<button class="btn-secondary" data-oid="' + oid + '" onclick="cancelOrder(\'' + oid + '\')">取消</button>' +
        '</div>';
    } else if (order.status === 'ready') {
      btnsHtml = '<div class="btn-row">' +
        '<button class="btn-primary" data-oid="' + oid + '" onclick="updateStatus(\'' + oid + '\',\'completed\')">✓ 归档完成</button>' +
        '</div>';
    }
  }

  // Payment method
  var payLabel = PAY_LABELS[order.payment_method] || order.payment_method || '';

  // Print button (always shown)
  var printBtn = '<button class="btn-print" onclick="printReceipt(\'' + order.id + '\')">🖨 打印小票</button>';

  card.innerHTML =
    '<div class="card-header">' +
      '<div>' +
        '<div class="order-num">#' + order.order_number + '</div>' +
        '<div class="order-meta">' +
          date + ' ' + time +
          (memberHtml ? ' · ' + memberHtml : '') +
        '</div>' +
        '<span class="status-tag ' + tagCls + '">' + tagLabel + '</span>' +
      '</div>' +
      '<div>' +
        '<div class="order-total">' + order.total.toLocaleString() + ' Ft</div>' +
        '<div class="pay-method">' + payLabel + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="items-block">' + itemsHtml + '</div>' +
    toppingsHtml +
    studentDiscHtml +
    notesHtml +
    cancelReasonHtml +
    btnsHtml +
    printBtn;

  return card;
}

// ── PRINT RECEIPT ─────────────────────────────────────────
function printReceipt(orderId) {
  var order = ordersById[orderId];
  if (!order) return;

  var d        = new Date(order.created_at);
  var dateTime = d.getFullYear() + '/' + pad2(d.getMonth()+1) + '/' + pad2(d.getDate()) +
                 '  ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  var items    = order.order_items    || [];
  var toppings = order.order_toppings || [];
  var payLabel = PAY_LABELS[order.payment_method] || order.payment_method || '';

  var baseMap = { pearl: 'Tapioca Pearls', coconut: 'Coconut Jelly', boba: 'Popping Boba' };

  // Build per-item blocks with structured spec lines
  var itemBlocks = '';
  for (var i = 0; i < items.length; i++) {
    var item     = items[i];
    var qtyLabel = item.quantity > 1 ? ' ×' + item.quantity : '';
    var specs    = '';
    if (item.size)        specs += '<div class="spec">Size : ' + escHtml(item.size) + '</div>';
    if (item.base_choice) specs += '<div class="spec">Base : ' + escHtml(baseMap[item.base_choice] || item.base_choice) + '</div>';
    if (item.sweetness)   specs += '<div class="spec">Sugar: ' + escHtml(item.sweetness) + '</div>';
    if (item.ice)         specs += '<div class="spec">Ice  : ' + escHtml(item.ice) + '</div>';
    itemBlocks +=
      '<div class="item">' +
        '<div class="item-hdr">' +
          '<span class="item-n">' + escHtml(item.product_name) + escHtml(qtyLabel) + '</span>' +
          '<span class="item-p">' + item.total_price.toLocaleString() + ' Ft</span>' +
        '</div>' +
        specs +
      '</div>';
  }

  // Toppings
  var toppingBlocks = '';
  for (var t = 0; t < toppings.length; t++) {
    var tp = toppings[t];
    toppingBlocks +=
      '<div class="tp-row">' +
        '<span>+ ' + escHtml(tp.topping_name) + '</span>' +
        '<span>' + (tp.price ? tp.price.toLocaleString() + ' Ft' : '免费') + '</span>' +
      '</div>';
  }

  var notesBlock = (order.notes && order.notes.trim())
    ? '<div class="notes">备注：' + escHtml(order.notes) + '</div>' : '';

  var studentDiscBlock = order.student_discount
    ? '<div class="tp-row" style="color:#27ae60"><span>Student discount</span><span>−200 Ft</span></div>' : '';

  var css =
    '@page{size:80mm auto;margin:3mm 4mm}' +
    '*{margin:0;padding:0;box-sizing:border-box}' +
    'body{font-family:"Courier New",Courier,monospace;font-size:12px;color:#000}' +
    '.c{text-align:center}' +
    '.shop{font-size:16px;font-weight:bold;letter-spacing:3px;margin:3px 0 1px}' +
    '.addr{font-size:10px;margin-bottom:5px}' +
    '.dv{border-top:1px dashed #555;margin:5px 0}' +
    '.onum{font-size:18px;font-weight:bold;margin:3px 0 1px}' +
    '.otime{font-size:10px;color:#444}' +
    '.opay{font-size:11px;color:#333;margin-top:2px;margin-bottom:4px}' +
    '.item{margin:5px 0}' +
    '.item-hdr{display:flex;justify-content:space-between;align-items:baseline;gap:4px}' +
    '.item-n{font-weight:bold;flex:1}' +
    '.item-p{white-space:nowrap;text-align:right}' +
    '.spec{font-size:10px;color:#333;padding-left:8px;line-height:1.7}' +
    '.tp-row{display:flex;justify-content:space-between;font-size:11px;color:#444;margin:2px 0}' +
    '.notes{font-size:11px;border:1px dashed #aaa;padding:3px 5px;margin:3px 0}' +
    '.total{display:flex;justify-content:space-between;font-size:14px;font-weight:bold;margin:3px 0}' +
    '.thanks{font-size:11px;margin-top:5px}';

  var html =
    '<!DOCTYPE html><html><head><meta charset="UTF-8">' +
    '<title>#' + order.order_number + '</title>' +
    '<style>' + css + '</style></head><body>' +
    '<div class="c"><div class="shop">WHITE LEAF</div><div class="addr">Eger, Hungary</div></div>' +
    '<div class="dv"></div>' +
    '<div class="onum">#' + order.order_number + '</div>' +
    '<div class="otime">' + dateTime + '</div>' +
    '<div class="opay">' + payLabel + '</div>' +
    '<div class="dv"></div>' +
    itemBlocks +
    (toppingBlocks    ? '<div class="dv"></div>' + toppingBlocks    : '') +
    (studentDiscBlock ? '<div class="dv"></div>' + studentDiscBlock : '') +
    (notesBlock       ? '<div class="dv"></div>' + notesBlock       : '') +
    '<div class="dv"></div>' +
    '<div class="total"><span>合计</span><span>' + order.total.toLocaleString() + ' Ft</span></div>' +
    '<div class="dv"></div>' +
    '<div class="c thanks">谢谢惠顾！ · Thank you!</div>' +
    '</body></html>';

  var win = window.open('', '_blank', 'width=420,height=640,left=200,top=80');
  if (!win) { showToast('请允许弹出窗口后重试'); return; }
  win.document.write(html);
  win.document.close();
  win.focus();
  setTimeout(function() { win.print(); }, 350);
}

// ── UTILS ─────────────────────────────────────────────────
function pad2(n) { return n < 10 ? '0' + n : '' + n; }

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function setOnline(on) {
  document.getElementById('status-dot').classList.toggle('offline', !on);
}

function updateBadge() {
  var count = 0;
  for (var i = 0; i < activeOrders.length; i++) {
    if (activeOrders[i].status === 'pending_confirm') count++;
  }
  var badge = document.getElementById('pending-badge');
  if (count > 0) {
    badge.textContent = count + ' 新';
    badge.classList.add('show');
  } else {
    badge.classList.remove('show');
  }
}

function showView(v) {
  document.getElementById('nav-active').classList.toggle('active',  v === 'active');
  document.getElementById('nav-history').classList.toggle('active', v === 'history');
  document.getElementById('nav-stats').classList.toggle('active',   v === 'stats');
  document.body.classList.toggle('show-history', v === 'history');
  document.body.classList.toggle('show-stats',   v === 'stats');
  if (v === 'stats') fetchStats();
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent  = msg;
  t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(function() { t.style.opacity = '0'; }, 2500);
}

// ── AUTH ──────────────────────────────────────────────────
async function doLogin() {
  var pin    = document.getElementById('pin-input').value.trim();
  var errEl  = document.getElementById('pin-error');
  var btn    = document.getElementById('pin-btn');
  if (!pin) { errEl.textContent = '请输入 PIN 码'; return; }
  btn.disabled = true;
  errEl.textContent = '';
  try {
    var res  = await fetch(API + '/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin: pin })
    });
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed');
    adminToken = data.token;
    localStorage.setItem('wl_admin_token', adminToken);
    document.getElementById('pin-screen').classList.add('hidden');
    document.getElementById('pin-input').value = '';
    startPolling();
  } catch(e) {
    errEl.textContent = 'PIN 错误，请重试';
  } finally {
    btn.disabled = false;
  }
}

function doLogout() {
  adminToken = '';
  localStorage.removeItem('wl_admin_token');
  if (pollInterval)  clearInterval(pollInterval);
  if (statsInterval) clearInterval(statsInterval);
  pollInterval = statsInterval = null;
  document.getElementById('pin-screen').classList.remove('hidden');
  document.getElementById('pin-input').value = '';
  document.getElementById('pin-error').textContent = '';
}

function startPolling() {
  if (pollInterval)  clearInterval(pollInterval);
  if (statsInterval) clearInterval(statsInterval);
  fetchOrders();
  fetchStats();
  pollInterval  = setInterval(fetchOrders, POLL_INTERVAL);
  statsInterval = setInterval(fetchStats, 60000);
}

// ── STATS ─────────────────────────────────────────────────
async function fetchStats() {
  try {
    var res  = await fetch(API + '/api/admin/dashboard', {
      headers: { 'Authorization': 'Bearer ' + adminToken }
    });
    if (res.status === 401 || res.status === 403) { doLogout(); return; }
    if (!res.ok) return;
    var data = await res.json();
    document.getElementById('stat-orders').textContent  = data.todayOrders || 0;
    document.getElementById('stat-revenue').textContent = (data.todayRevenue || 0).toLocaleString();
    document.getElementById('stat-avg').textContent     = data.avgOrderValue ? data.avgOrderValue.toLocaleString() : '—';
    document.getElementById('stat-student').textContent = data.studentDiscountOrders || 0;
    renderStats(data);
  } catch(e) {}
}

function renderStats(data) {
  var el = document.getElementById('stats-detail');
  if (!data) return;

  var ranks = ['🥇','🥈','🥉'];
  var topHtml = '';
  var drinks  = data.topDrinks || [];
  if (drinks.length > 0) {
    for (var i = 0; i < drinks.length; i++) {
      topHtml +=
        '<div class="top-drink-row">' +
          '<span class="top-drink-rank">' + ranks[i] + '</span>' +
          '<span class="top-drink-name">'  + escHtml(drinks[i].name) + '</span>' +
          '<span class="top-drink-count">' + drinks[i].count + ' 杯</span>' +
        '</div>';
    }
  } else {
    topHtml = '<div class="empty-state" style="padding:30px 20px"><div class="empty-text">今日暂无数据</div></div>';
  }

  el.innerHTML =
    '<div class="order-card">' +
      '<div class="stats-grid">' +
        '<div class="stats-grid-item"><div class="stats-grid-val">' + (data.todayOrders || 0) + '</div><div class="stats-grid-label">今日订单</div></div>' +
        '<div class="stats-grid-item"><div class="stats-grid-val">' + (data.todayRevenue || 0).toLocaleString() + '</div><div class="stats-grid-label">营业额 Ft</div></div>' +
        '<div class="stats-grid-item"><div class="stats-grid-val">' + (data.avgOrderValue ? data.avgOrderValue.toLocaleString() : '—') + '</div><div class="stats-grid-label">均单价 Ft</div></div>' +
        '<div class="stats-grid-item"><div class="stats-grid-val">' + (data.studentDiscountOrders || 0) + '</div><div class="stats-grid-label">学生优惠单</div></div>' +
      '</div>' +
    '</div>' +
    '<div class="section-label" style="margin-top:20px">热销饮品 Top 3</div>' +
    '<div class="order-card">' + topHtml + '</div>';
}

// ── INIT ──────────────────────────────────────────────────
document.addEventListener('touchstart', initAudio, { once: true });
document.addEventListener('click',      initAudio, { once: true });

document.getElementById('pin-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});

if (adminToken) {
  document.getElementById('pin-screen').classList.add('hidden');
  startPolling();
}
</script>

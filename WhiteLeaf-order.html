<title>White Leaf — Order</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f5f2ec;
    --green-dark: #2d4a3e;
    --green-mid: #6b8f71;
    --green-light: #a8c5a0;
    --charcoal: #2a2a2a;
    --warm-gray: #8a8680;
    --accent: #c4a882;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: var(--cream);
    color: var(--charcoal);
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    min-height: 100vh;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(107,143,113,0.06) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(45,74,62,0.05) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }
  .lang-bar {
    position: sticky; top: 0; z-index: 100;
    background: var(--cream);
    border-bottom: 1px solid rgba(107,143,113,0.15);
    padding: 10px 20px;
    display: flex; justify-content: center; gap: 8px;
  }
  .lang-btn {
    font-family: 'Jost', sans-serif;
    font-size: 11px; font-weight: 300;
    letter-spacing: 0.2em; text-transform: uppercase;
    padding: 6px 18px; border-radius: 20px;
    border: 1px solid rgba(107,143,113,0.3);
    background: transparent; color: var(--warm-gray);
    cursor: pointer; transition: all 0.25s ease;
  }
  .lang-btn.active { background: var(--green-dark); color: var(--cream); border-color: var(--green-dark); }
  .lang-btn:hover:not(.active) { border-color: var(--green-mid); color: var(--green-dark); }
  .page { max-width: 680px; margin: 0 auto; padding: 48px 40px 120px; position: relative; z-index: 1; }
  .header { text-align: center; margin-bottom: 40px; animation: fadeDown 0.7s ease both; }
  .logo-mark { display: flex; justify-content: center; margin-bottom: 18px; }
  .logo-svg { width: 60px; height: 60px; opacity: 0.9; }
  .brand-name { font-family: 'Cormorant Garamond', serif; font-size: 40px; font-weight: 300; letter-spacing: 0.12em; color: var(--green-dark); line-height: 1; }
  .brand-sub { font-size: 10px; letter-spacing: 0.35em; text-transform: uppercase; color: var(--warm-gray); margin-top: 7px; }
  .header-divider { display: flex; align-items: center; gap: 16px; margin-top: 24px; justify-content: center; }
  .header-divider::before, .header-divider::after { content: ''; width: 55px; height: 1px; background: var(--green-light); }
  .header-divider span { font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--green-mid); }
  .section { margin-bottom: 36px; }
  .section-header { display: flex; align-items: center; gap: 12px; margin-bottom: 5px; }
  .section-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green-dark); flex-shrink: 0; }
  .section-title { font-family: 'Cormorant Garamond', serif; font-size: 21px; font-weight: 400; letter-spacing: 0.06em; color: var(--green-dark); }
  .section-line { flex: 1; height: 1px; background: linear-gradient(to right, var(--green-light), transparent); }
  .section-desc { font-size: 11px; color: var(--warm-gray); letter-spacing: 0.04em; margin-bottom: 14px; padding-left: 19px; font-style: italic; }
  .product-card {
    border: 1px solid rgba(107,143,113,0.2); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 10px;
    cursor: pointer; transition: all 0.2s ease;
    background: transparent; position: relative; user-select: none;
  }
  .product-card:hover { border-color: var(--green-mid); background: rgba(107,143,113,0.04); }
  .product-card.selected { border-color: var(--green-dark); background: rgba(45,74,62,0.06); }
  .product-card.selected::after { content: '✓'; position: absolute; right: 14px; top: 14px; color: var(--green-dark); font-size: 16px; }
  .product-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .product-name { font-family: 'Cormorant Garamond', serif; font-size: 17px; font-weight: 400; color: var(--charcoal); letter-spacing: 0.02em; }
  .product-name-zh { font-size: 10px; color: var(--green-mid); margin-top: 2px; letter-spacing: 0.05em; }
  .product-price { font-family: 'Cormorant Garamond', serif; font-size: 14px; color: var(--warm-gray); white-space: nowrap; text-align: right; flex-shrink: 0; padding-right: 20px; }
  .size-options { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(107,143,113,0.15); gap: 8px; flex-wrap: wrap; align-items: center; }
  .product-card.selected .size-options { display: flex; }
  .size-btn { font-family: 'Jost', sans-serif; font-size: 11px; font-weight: 300; letter-spacing: 0.15em; text-transform: uppercase; padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(107,143,113,0.35); background: transparent; color: var(--warm-gray); cursor: pointer; transition: all 0.2s; }
  .size-btn.active { background: var(--green-dark); color: var(--cream); border-color: var(--green-dark); }
  .qty-controls { display: none; align-items: center; gap: 10px; margin-top: 10px; }
  .product-card.selected .qty-controls { display: flex; }
  .qty-btn { width: 28px; height: 28px; border-radius: 50%; border: 1px solid rgba(107,143,113,0.4); background: transparent; color: var(--green-dark); font-size: 16px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
  .qty-btn:hover { background: var(--green-dark); color: var(--cream); }
  .qty-display { font-family: 'Cormorant Garamond', serif; font-size: 18px; color: var(--green-dark); min-width: 20px; text-align: center; }
  .qty-label { font-size: 10px; color: var(--warm-gray); letter-spacing: 0.1em; }
  .customize-section { background: rgba(45,74,62,0.04); border: 1px solid rgba(107,143,113,0.2); border-radius: 10px; padding: 20px 22px; margin-bottom: 36px; }
  .customize-title { font-family: 'Cormorant Garamond', serif; font-size: 17px; color: var(--green-dark); letter-spacing: 0.06em; margin-bottom: 16px; }
  .customize-row { margin-bottom: 14px; }
  .customize-label { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--warm-gray); margin-bottom: 8px; }
  .option-group { display: flex; gap: 7px; flex-wrap: wrap; }
  .opt-btn { font-family: 'Jost', sans-serif; font-size: 11px; font-weight: 300; letter-spacing: 0.1em; padding: 5px 13px; border-radius: 20px; border: 1px solid rgba(107,143,113,0.3); background: transparent; color: var(--warm-gray); cursor: pointer; transition: all 0.2s; }
  .opt-btn.active { background: var(--green-dark); color: var(--cream); border-color: var(--green-dark); }
  .notes-section { margin-bottom: 36px; }
  .notes-label { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--warm-gray); margin-bottom: 8px; }
  .notes-input { width: 100%; background: transparent; border: 1px solid rgba(107,143,113,0.25); border-radius: 8px; padding: 12px 14px; font-family: 'Jost', sans-serif; font-size: 13px; font-weight: 300; color: var(--charcoal); resize: none; outline: none; transition: border-color 0.2s; }
  .notes-input:focus { border-color: var(--green-mid); }
  .notes-input::placeholder { color: rgba(138,134,128,0.5); }
  .order-summary { background: rgba(45,74,62,0.05); border: 1px solid rgba(107,143,113,0.25); border-radius: 10px; padding: 20px 22px; margin-bottom: 24px; }
  .summary-title { font-family: 'Cormorant Garamond', serif; font-size: 15px; color: var(--green-dark); letter-spacing: 0.06em; margin-bottom: 12px; }
  .summary-empty { font-size: 12px; color: var(--warm-gray); font-style: italic; }
  .summary-item { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--charcoal); padding: 5px 0; border-bottom: 1px solid rgba(107,143,113,0.1); gap: 12px; }
  .summary-item:last-child { border-bottom: none; }
  .summary-item-name { flex: 1; }
  .summary-item-price { color: var(--warm-gray); font-family: 'Cormorant Garamond', serif; font-size: 14px; white-space: nowrap; }
  .summary-total { display: flex; justify-content: space-between; margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(107,143,113,0.2); font-family: 'Cormorant Garamond', serif; font-size: 18px; color: var(--green-dark); }
  .submit-btn { width: 100%; background: var(--green-dark); color: var(--cream); border: none; border-radius: 10px; padding: 18px; font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 400; letter-spacing: 0.1em; cursor: pointer; transition: all 0.25s ease; margin-bottom: 12px; }
  .submit-btn:hover { background: #1e3329; transform: translateY(-1px); }
  .submit-btn:disabled { background: rgba(107,143,113,0.3); color: var(--warm-gray); cursor: not-allowed; transform: none; }
  .submit-note { text-align: center; font-size: 10.5px; color: var(--warm-gray); letter-spacing: 0.05em; line-height: 1.6; }
  .success-screen { display: none; text-align: center; padding: 60px 20px; animation: fadeIn 0.5s ease both; }
  .success-screen.show { display: block; }
  .success-icon { width: 64px; height: 64px; border: 2px solid var(--green-mid); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; font-size: 28px; }
  .success-title { font-family: 'Cormorant Garamond', serif; font-size: 28px; color: var(--green-dark); letter-spacing: 0.08em; margin-bottom: 12px; }
  .success-desc { font-size: 13px; color: var(--warm-gray); line-height: 1.8; margin-bottom: 32px; }
  .order-number { font-family: 'Cormorant Garamond', serif; font-size: 36px; color: var(--green-dark); letter-spacing: 0.15em; margin-bottom: 8px; }
  .order-number-label { font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--warm-gray); margin-bottom: 40px; }
  .new-order-btn { font-family: 'Jost', sans-serif; font-size: 11px; font-weight: 300; letter-spacing: 0.2em; text-transform: uppercase; padding: 10px 28px; border-radius: 20px; border: 1px solid rgba(107,143,113,0.4); background: transparent; color: var(--green-dark); cursor: pointer; transition: all 0.2s; }
  .new-order-btn:hover { background: var(--green-dark); color: var(--cream); border-color: var(--green-dark); }
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @media (max-width: 500px) { .page { padding: 36px 20px 100px; } .brand-name { font-size: 34px; } }
</style>
</head>

    successDesc: 'Please proceed to the counter to pay. We will start preparing your drink shortly.',
    orderNumLabel: 'Order Number', newOrderBtn: 'New Order',
    sizeLabel: 'Size', qtyLabel: 'Qty',
    customTitleSlush: 'Slush is fixed — no customisation needed',
  },
  hu: {
    sub: 'Rendel\u00e9s lead\u00e1sa', divider: 'Rendel\u00e9s',
    customTitle: 'Alak\u00edtsd kedvedre!',
    sweetLabel: '\u00c9dess\u00e9g', iceLabel: 'J\u00e9g',
    sweetOpts: ['0%','30%','50%','70%','100%'],
    iceOpts: ['J\u00e9g n\u00e9lk\u00fcl','Kevesebb','Norm\u00e1l','Extra'],
    defaultSweetness: '50%', defaultIce: 'Norm\u00e1l',
    notesLabel: 'K\u00fcl\u00f6nleges k\u00e9r\u00e9s', notesPlaceholder: 'Allergia, k\u00fcl\u00f6nleges k\u00e9r\u00e9sek...',
    summaryTitle: 'Rendel\u00e9sed', summaryEmpty: 'M\u00e9g nem v\u00e1lasztott\u00e1l term\u00e9ket.',
    totalLabel: '\u00d6sszesen', submitText: 'Rendel\u00e9s lead\u00e1sa',
    submitNote: 'Fizet\u00e9s a pultban a rendel\u00e9s lead\u00e1sa ut\u00e1n.',
    successTitle: 'Rendel\u00e9s fogadva!',
    successDesc: 'K\u00e9rj\u00fck menj a pulthoz fizetni. Nemsok\u00e1ra elk\u00e9sz\u00edtj\u00fck italodat.',
    orderNumLabel: 'Rendel\u00e9ssz\u00e1m', newOrderBtn: '\u00daj rendel\u00e9s',
    sizeLabel: 'M\u00e9ret', qtyLabel: 'Db',
    customTitleSlush: 'A j\u00e9gk\u00e1sa r\u00f6gz\u00edtett \u2014 nem szab\u00e1lyozhat\u00f3',
  }
};

let currentLang = 'en';
let cart = {};
let sweetness = '50%';
let ice = 'Normal';

document.getElementById('btn-en').addEventListener('click', function() { setLang('en'); });
document.getElementById('btn-hu').addEventListener('click', function() { setLang('hu'); });
document.getElementById('submit-btn').addEventListener('click', submitOrder);
document.getElementById('new-order-btn').addEventListener('click', resetOrder);

function setLang(lang) {
  currentLang = lang;
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-hu').classList.toggle('active', lang === 'hu');
  cart = {};
  sweetness = i18n[lang].defaultSweetness;
  ice = i18n[lang].defaultIce;
  renderAll();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderAll() {
  var t = i18n[currentLang];
  document.getElementById('sub-text').textContent = t.sub;
  document.getElementById('divider-text').textContent = t.divider;
  document.getElementById('custom-title').textContent = t.customTitle;
  document.getElementById('sweet-label').textContent = t.sweetLabel;
  document.getElementById('ice-label').textContent = t.iceLabel;
  document.getElementById('notes-label').textContent = t.notesLabel;
  document.getElementById('notes-input').placeholder = t.notesPlaceholder;
  document.getElementById('summary-title').textContent = t.summaryTitle;
  document.getElementById('total-label').textContent = t.totalLabel;
  document.getElementById('submit-text').textContent = t.submitText;
  document.getElementById('submit-note').textContent = t.submitNote;

  var sg = document.getElementById('sweetness-group');
  sg.innerHTML = '';
  t.sweetOpts.forEach(function(v) {
    var b = document.createElement('button');
    b.className = 'opt-btn' + (v === sweetness ? ' active' : '');
    b.textContent = v;
    b.addEventListener('click', function() { selectOpt('sweetness', v, sg); });
    sg.appendChild(b);
  });

  var ig = document.getElementById('ice-group');
  ig.innerHTML = '';
  t.iceOpts.forEach(function(v) {
    var b = document.createElement('button');
    b.className = 'opt-btn' + (v === ice ? ' active' : '');
    b.textContent = v;
    b.addEventListener('click', function() { selectOpt('ice', v, ig); });
    ig.appendChild(b);
  });

  renderProducts();
  renderSummary();
}

function renderProducts() {
  var container = document.getElementById('products-container');
  container.innerHTML = '';
  var data = products[currentLang];
  var t = i18n[currentLang];

  data.forEach(function(section) {
    var secDiv = document.createElement('div');
    secDiv.className = 'section';

    var header = document.createElement('div');
    header.className = 'section-header';
    header.innerHTML = '<div class="section-dot"></div>';
    var titleEl = document.createElement('div');
    titleEl.className = 'section-title';
    titleEl.textContent = section.section;
    var lineEl = document.createElement('div');
    lineEl.className = 'section-line';
    header.appendChild(titleEl);
    header.appendChild(lineEl);
    secDiv.appendChild(header);

    var descEl = document.createElement('div');
    descEl.className = 'section-desc';
    descEl.textContent = section.desc;
    secDiv.appendChild(descEl);

    section.items.forEach(function(item) {
      var inCart = cart[item.id];
      var isSelected = !!inCart;
      var selectedSize = inCart ? inCart.size : item.sizes[0];
      var qty = inCart ? inCart.qty : 1;

      var priceStr = item.sizes.length > 1
        ? item.sizes.map(function(s) { return s + ' ' + item.prices[s].toLocaleString() + ' Ft'; }).join(' / ')
        : Object.values(item.prices)[0].toLocaleString() + ' Ft';

      var card = document.createElement('div');
      card.className = 'product-card' + (isSelected ? ' selected' : '');
      card.id = 'card-' + item.id;

      var productTop = document.createElement('div');
      productTop.className = 'product-top';

      var nameDiv = document.createElement('div');
      var nameEl = document.createElement('div');
      nameEl.className = 'product-name';
      nameEl.textContent = item.name;
      var zhEl = document.createElement('div');
      zhEl.className = 'product-name-zh';
      zhEl.textContent = item.zh;
      nameDiv.appendChild(nameEl);
      nameDiv.appendChild(zhEl);

      var priceEl = document.createElement('div');
      priceEl.className = 'product-price';
      priceEl.textContent = priceStr;

      productTop.appendChild(nameDiv);
      productTop.appendChild(priceEl);
      productTop.addEventListener('click', (function(id) {
        return function() { toggleProduct(id); };
      })(item.id));

      var sizeDiv = document.createElement('div');
      sizeDiv.className = 'size-options';
      var sizeSpan = document.createElement('span');
      sizeSpan.style.cssText = 'font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:var(--warm-gray);margin-right:4px;';
      sizeSpan.textContent = t.sizeLabel;
      sizeDiv.appendChild(sizeSpan);
      item.sizes.forEach(function(s) {
        var btn = document.createElement('button');
        btn.className = 'size-btn' + (s === selectedSize ? ' active' : '');
        btn.textContent = s;
        btn.addEventListener('click', (function(id, size) {
          return function(e) { e.stopPropagation(); selectSize(id, size); };
        })(item.id, s));
        sizeDiv.appendChild(btn);
      });

      var qtyDiv = document.createElement('div');
      qtyDiv.className = 'qty-controls';
      var minusBtn = document.createElement('button');
      minusBtn.className = 'qty-btn';
      minusBtn.textContent = '-';
      minusBtn.addEventListener('click', (function(id) {
        return function(e) { e.stopPropagation(); changeQty(id, -1); };
      })(item.id));
      var qtyDisplay = document.createElement('span');
      qtyDisplay.className = 'qty-display';
      qtyDisplay.id = 'qty-display-' + item.id;
      qtyDisplay.textContent = qty;
      var plusBtn = document.createElement('button');
      plusBtn.className = 'qty-btn';
      plusBtn.textContent = '+';
      plusBtn.addEventListener('click', (function(id) {
        return function(e) { e.stopPropagation(); changeQty(id, 1); };
      })(item.id));
      var qtyLabel = document.createElement('span');
      qtyLabel.className = 'qty-label';
      qtyLabel.textContent = t.qtyLabel;
      qtyDiv.appendChild(minusBtn);
      qtyDiv.appendChild(qtyDisplay);
      qtyDiv.appendChild(plusBtn);
      qtyDiv.appendChild(qtyLabel);

      card.appendChild(productTop);
      card.appendChild(sizeDiv);
      card.appendChild(qtyDiv);
      secDiv.appendChild(card);
    });

    container.appendChild(secDiv);
  });
}

function isSlushOnly() {
  var keys = Object.keys(cart);
  if (keys.length === 0) return false;
  return keys.every(function(id) { return id.indexOf('sl-') === 0; });
}

function updateCustomizeVisibility() {
  var section = document.querySelector('.customize-section');
  if (!section) return;
  var titleEl = document.getElementById('custom-title');
  if (isSlushOnly()) {
    section.style.opacity = '0.35';
    section.style.pointerEvents = 'none';
    titleEl.textContent = i18n[currentLang].customTitleSlush;
  } else {
    section.style.opacity = '1';
    section.style.pointerEvents = '';
    titleEl.textContent = i18n[currentLang].customTitle;
  }
}

function toggleProduct(id) {
  if (cart[id]) {
    delete cart[id];
  } else {
    var item = findItem(id);
    cart[id] = { name: item.name, zh: item.zh, size: item.sizes[0], qty: 1, prices: item.prices };
  }
  renderProducts();
  renderSummary();
  updateCustomizeVisibility();
}

function selectSize(id, size) {
  if (!cart[id]) return;
  cart[id].size = size;
  renderProducts();
  renderSummary();
}

function changeQty(id, delta) {
  if (!cart[id]) return;
  cart[id].qty = Math.max(1, cart[id].qty + delta);
  var el = document.getElementById('qty-display-' + id);
  if (el) el.textContent = cart[id].qty;
  renderSummary();
}

function findItem(id) {
  var data = products[currentLang];
  for (var i = 0; i < data.length; i++) {
    for (var j = 0; j < data[i].items.length; j++) {
      if (data[i].items[j].id === id) return data[i].items[j];
    }
  }
  return null;
}

function selectOpt(type, val, group) {
  group.querySelectorAll('.opt-btn').forEach(function(b) { b.classList.remove('active'); });
  group.querySelectorAll('.opt-btn').forEach(function(b) {
    if (b.textContent === val) b.classList.add('active');
  });
  if (type === 'sweetness') sweetness = val;
  if (type === 'ice') ice = val;
}

function renderSummary() {
  var t = i18n[currentLang];
  var content = document.getElementById('summary-content');
  var totalEl = document.getElementById('summary-total');
  var totalAmt = document.getElementById('total-amount');
  var submitBtn = document.getElementById('submit-btn');
  var keys = Object.keys(cart);

  if (keys.length === 0) {
    content.innerHTML = '';
    var emptyEl = document.createElement('div');
    emptyEl.className = 'summary-empty';
    emptyEl.textContent = t.summaryEmpty;
    content.appendChild(emptyEl);
    totalEl.style.display = 'none';
    submitBtn.disabled = true;
    return;
  }

  content.innerHTML = '';
  var total = 0;
  keys.forEach(function(id) {
    var c = cart[id];
    var price = c.prices[c.size] * c.qty;
    total += price;
    var row = document.createElement('div');
    row.className = 'summary-item';
    var nameSpan = document.createElement('span');
    nameSpan.className = 'summary-item-name';
    nameSpan.textContent = c.name + ' · ' + c.size + (c.qty > 1 ? ' x' + c.qty : '');
    var priceSpan = document.createElement('span');
    priceSpan.className = 'summary-item-price';
    priceSpan.textContent = price.toLocaleString() + ' Ft';
    row.appendChild(nameSpan);
    row.appendChild(priceSpan);
    content.appendChild(row);
  });

  totalEl.style.display = 'flex';
  totalAmt.textContent = total.toLocaleString() + ' Ft';
  submitBtn.disabled = false;
}

function generateOrderNum() {
  return Math.floor(1000 + Math.random() * 9000).toString();
}

async function submitOrder() {
  var t = i18n[currentLang];
  var btn = document.getElementById('submit-btn');
  btn.disabled = true;
  document.getElementById('submit-text').textContent = '...';

  var orderNum = generateOrderNum();
  var timestamp = new Date().toLocaleString('hu-HU', { timeZone: 'Europe/Budapest' });
  var lines = Object.values(cart).map(function(c) {
    return c.name + ' (' + c.zh + ') · ' + c.size + (c.qty > 1 ? ' x' + c.qty : '') + ' · ' + (c.prices[c.size] * c.qty).toLocaleString() + ' Ft';
  });
  var total = Object.values(cart).reduce(function(s, c) { return s + c.prices[c.size] * c.qty; }, 0);
  var notes = document.getElementById('notes-input').value.trim();

  var payload = {
    orderNum: orderNum,
    timestamp: timestamp,
    items: lines.join('\n'),
    sweetness: sweetness,
    ice: ice,
    notes: notes,
    total: total.toLocaleString() + ' Ft',
    lang: currentLang
  };

  try {
    await fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
  } catch(e) {}

  document.getElementById('order-form').style.display = 'none';
  var s = document.getElementById('success-screen');
  s.classList.add('show');
  document.getElementById('success-title').textContent = t.successTitle;
  document.getElementById('success-desc').textContent = t.successDesc;
  document.getElementById('order-number').textContent = '#' + orderNum;
  document.getElementById('order-num-label').textContent = t.orderNumLabel;
  document.getElementById('new-order-btn').textContent = t.newOrderBtn;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetOrder() {
  cart = {};
  sweetness = i18n[currentLang].defaultSweetness;
  ice = i18n[currentLang].defaultIce;
  document.getElementById('notes-input').value = '';
  document.getElementById('order-form').style.display = 'block';
  document.getElementById('success-screen').classList.remove('show');
  renderAll();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderAll();
</script>

</body>
</html>

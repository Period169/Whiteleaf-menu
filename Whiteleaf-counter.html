<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>White Leaf — Counter POS</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
/* ── Reset & Root ────────────────────────────────────────────────────────── */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --g-dark:  #2d4a3e;
  --g-mid:   #6b8f71;
  --g-light: #a8c5a0;
  --cream:   #f5f2ec;
  --bg:      #edeae3;
  --white:   #ffffff;
  --ink:     #1a1a1a;
  --gray:    #8a8680;
  --accent:  #c4a882;
  --border:  rgba(107,143,113,0.16);
  --red:     #e05555;
  --green:   #27ae60;
}
html, body { height:100%; overflow:hidden; background:var(--g-dark);
  font-family:'Jost',sans-serif; font-weight:300; color:var(--ink); }

/* ── PIN Screen ──────────────────────────────────────────────────────────── */
#pin-screen {
  position:fixed; inset:0; z-index:9999; background:var(--g-dark);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.pin-logo { font-family:'Cormorant Garamond',serif; font-size:46px; font-weight:300;
  color:var(--cream); letter-spacing:0.12em; margin-bottom:4px; }
.pin-sub  { font-size:10px; letter-spacing:0.32em; text-transform:uppercase;
  color:rgba(168,197,160,.6); margin-bottom:48px; }
.pin-input { width:260px; background:rgba(255,255,255,.09);
  border:1px solid rgba(168,197,160,.28); border-radius:10px;
  padding:15px 22px; font-family:'Jost',sans-serif; font-size:22px;
  color:var(--cream); text-align:center; letter-spacing:0.25em;
  outline:none; transition:border-color .2s; margin-bottom:14px; }
.pin-input:focus { border-color:rgba(168,197,160,.7); }
.pin-input::placeholder { color:rgba(245,242,236,.25); font-size:14px; letter-spacing:.08em; }
.pin-btn  { width:260px; background:var(--g-light); color:var(--g-dark);
  border:none; border-radius:10px; padding:15px; font-family:'Jost',sans-serif;
  font-size:13px; font-weight:500; letter-spacing:.18em; text-transform:uppercase;
  cursor:pointer; transition:all .18s; margin-bottom:14px; }
.pin-btn:hover:not(:disabled) { background:var(--cream); }
.pin-btn:disabled { opacity:.4; cursor:not-allowed; }
.pin-error { font-size:12px; color:#e8928a; min-height:18px; text-align:center; }

/* ── App Shell ───────────────────────────────────────────────────────────── */
#pos-app { height:100%; display:none; flex-direction:column; }
#pos-app.on { display:flex; }

/* Top bar */
.topbar { height:52px; background:var(--g-dark); flex-shrink:0;
  display:flex; align-items:center; justify-content:space-between; padding:0 18px; }
.topbar-logo { display:flex; align-items:center; gap:12px; }
.topbar-name { font-family:'Cormorant Garamond',serif; font-size:21px;
  color:var(--cream); letter-spacing:.1em; }
.topbar-badge { font-size:9px; letter-spacing:.22em; text-transform:uppercase;
  background:rgba(168,197,160,.2); color:var(--g-light); padding:3px 10px; border-radius:10px; }
.topbar-logout { background:transparent; border:1px solid rgba(168,197,160,.28);
  color:rgba(245,242,236,.65); font-size:11px; letter-spacing:.12em;
  padding:6px 14px; border-radius:7px; cursor:pointer; transition:all .18s; }
.topbar-logout:hover { background:rgba(168,197,160,.15); color:var(--cream); }

/* ── 3-Column Body ───────────────────────────────────────────────────────── */
.pos-body { flex:1; display:grid;
  grid-template-columns:156px 1fr 328px; min-height:0; overflow:hidden; }

/* ── Category Sidebar (col 1) ────────────────────────────────────────────── */
.cat-col { background:var(--g-dark); display:flex; flex-direction:column;
  overflow-y:auto; padding:10px 0 20px; border-right:1px solid rgba(168,197,160,.1); }
.cat-item { padding:16px 18px; cursor:pointer; border-left:3px solid transparent;
  transition:all .16s; user-select:none; }
.cat-item:hover { background:rgba(168,197,160,.1); }
.cat-item.active { background:rgba(168,197,160,.16); border-left-color:var(--g-light); }
.cat-name { font-size:13px; color:rgba(245,242,236,.65); line-height:1.35;
  transition:color .16s; }
.cat-item:hover .cat-name, .cat-item.active .cat-name { color:var(--cream); }
.cat-item.active .cat-name { font-weight:400; }
.cat-cnt { font-size:10px; color:rgba(168,197,160,.45); margin-top:3px; }

/* ── Product Panel (col 2) ───────────────────────────────────────────────── */
.prod-panel { background:var(--cream); display:flex; flex-direction:column;
  overflow:hidden; min-width:0; }
.prod-header { padding:13px 18px 10px; border-bottom:1px solid var(--border);
  background:var(--bg); flex-shrink:0; }
.prod-header-title { font-family:'Cormorant Garamond',serif; font-size:19px;
  color:var(--g-dark); letter-spacing:.06em; }
.prod-header-desc { font-size:11px; color:var(--gray); margin-top:3px; }
.prod-grid { flex:1; overflow-y:auto; padding:13px;
  display:grid; grid-template-columns:repeat(3,1fr); gap:9px; align-content:start; }

/* Product button */
.prod-btn { background:var(--white); border:1.5px solid var(--border);
  border-radius:12px; padding:14px 13px 12px; cursor:pointer;
  transition:border-color .14s, box-shadow .14s, transform .1s;
  text-align:left; min-height:88px; display:flex; flex-direction:column;
  justify-content:space-between; }
.prod-btn:hover  { border-color:var(--g-mid); box-shadow:0 3px 14px rgba(45,74,62,.1); transform:translateY(-1px); }
.prod-btn:active { transform:scale(.97); border-color:var(--g-dark); background:rgba(45,74,62,.04); transition:transform .07s; }
.pb-name { font-family:'Cormorant Garamond',serif; font-size:14px;
  color:var(--ink); line-height:1.35; }
.pb-zh   { font-size:10px; color:var(--gray); margin-top:3px; }
.pb-price{ font-size:12px; color:var(--g-dark); font-weight:400; margin-top:9px; }

/* ── Cart Panel (col 3) ──────────────────────────────────────────────────── */
.cart-panel { background:var(--white); display:flex; flex-direction:column;
  border-left:1px solid var(--border); overflow:hidden; min-width:0; }

.cart-head { padding:12px 15px; border-bottom:1px solid rgba(107,143,113,.1);
  display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.cart-head-left { display:flex; align-items:baseline; gap:8px; }
.cart-title { font-family:'Cormorant Garamond',serif; font-size:18px;
  color:var(--g-dark); letter-spacing:.08em; }
.cart-badge { font-size:11px; color:var(--gray); }
.cart-clear { background:transparent; border:1px solid rgba(196,168,130,.3);
  color:#bbb; border-radius:6px; padding:5px 10px;
  font-size:11px; cursor:pointer; transition:all .16s; }
.cart-clear:hover { border-color:var(--red); color:var(--red); }

.cart-list  { flex:1; overflow-y:auto; min-height:0; }
.cart-empty { padding:52px 16px; text-align:center; color:#ccc; font-size:13px; }

/* Cart Item */
.ci { padding:10px 15px; border-bottom:1px solid rgba(107,143,113,.07);
  display:flex; gap:8px; align-items:flex-start; transition:background .14s; }
.ci:hover { background:rgba(45,74,62,.02); }
.ci-info  { flex:1; min-width:0; }
.ci-name  { font-family:'Cormorant Garamond',serif; font-size:14px;
  color:var(--ink); line-height:1.3; }
.ci-detail{ font-size:11px; color:var(--gray); margin-top:3px; line-height:1.55; }
.ci-qty-row { display:flex; align-items:center; gap:5px; margin-top:7px; }
.ci-qb { width:22px; height:22px; border-radius:50%;
  border:1px solid rgba(107,143,113,.28); background:transparent;
  color:var(--g-dark); font-size:15px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:all .14s; }
.ci-qb:hover { background:var(--g-dark); color:var(--cream); }
.ci-qn { font-size:13px; color:var(--ink); min-width:16px; text-align:center; }
.ci-right { display:flex; flex-direction:column; align-items:flex-end; gap:5px; flex-shrink:0; }
.ci-price { font-family:'Cormorant Garamond',serif; font-size:15px;
  color:var(--g-dark); white-space:nowrap; }
.ci-acts  { display:flex; gap:2px; }
.ci-edit, .ci-del { background:transparent; border:none; cursor:pointer;
  padding:4px 5px; border-radius:5px; font-size:15px; transition:all .14s; }
.ci-edit { color:#ccc; } .ci-edit:hover { color:var(--g-mid); background:rgba(107,143,113,.1); }
.ci-del  { color:#ccc; } .ci-del:hover  { color:var(--red);    background:rgba(224,85,85,.08); }

/* Cart Footer */
.cart-foot { border-top:2px solid rgba(107,143,113,.12); padding:11px 15px 13px; flex-shrink:0; }
.cf-row  { display:flex; justify-content:space-between; font-size:13px; color:var(--gray); padding:3px 0; }
.cf-disc { display:none; justify-content:space-between; font-size:13px;
  color:var(--green); padding:3px 0; }
.cf-disc.on { display:flex; }
.cf-total { display:flex; justify-content:space-between; align-items:baseline;
  border-top:1px solid rgba(107,143,113,.12); margin:8px 0 11px; padding-top:9px; }
.cf-tlbl  { font-size:10px; letter-spacing:.15em; text-transform:uppercase; color:var(--gray); }
.cf-tval  { font-family:'Cormorant Garamond',serif; font-size:28px; color:var(--g-dark); }
.cf-student { display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; }
.cf-slbl  { display:flex; align-items:center; gap:7px; cursor:pointer; font-size:12px; color:var(--ink); }
.cf-slbl input { width:15px; height:15px; accent-color:var(--g-dark); cursor:pointer; }
.cf-sbadge { font-size:10px; color:var(--green); background:rgba(39,174,96,.08);
  border:1px solid rgba(39,174,96,.25); padding:2px 7px; border-radius:10px; display:none; }
.cf-sbadge.on { display:inline-block; }
.cf-notes { width:100%; border:1px solid rgba(107,143,113,.2); border-radius:8px;
  padding:8px 11px; font-family:'Jost',sans-serif; font-size:12px; color:var(--ink);
  outline:none; transition:border-color .18s; margin-bottom:9px; user-select:text; }
.cf-notes:focus { border-color:var(--g-mid); }
.cf-notes::placeholder { color:rgba(138,134,128,.35); }
.cf-pay  { display:flex; gap:7px; margin-bottom:9px; }
.cf-pbtn { flex:1; padding:10px; border:1.5px solid rgba(107,143,113,.2);
  border-radius:9px; background:transparent; font-size:13px; color:var(--gray);
  cursor:pointer; transition:all .16s; text-align:center; }
.cf-pbtn:hover { border-color:var(--g-mid); color:var(--g-dark); }
.cf-pbtn.on { border-color:var(--g-dark); background:rgba(45,74,62,.07); color:var(--g-dark); font-weight:500; }
.cf-submit { width:100%; background:var(--g-dark); color:var(--cream); border:none;
  border-radius:10px; padding:16px; font-family:'Cormorant Garamond',serif;
  font-size:19px; letter-spacing:.08em; cursor:pointer; transition:all .18s; }
.cf-submit:hover:not(:disabled) { background:#1e3329; }
.cf-submit:disabled { background:rgba(107,143,113,.26); color:#aaa; cursor:not-allowed; }

/* Cart header pulse feedback */
@keyframes cart-flash {
  0%   { background:rgba(45,74,62,.12); }
  100% { background:var(--white); }
}
.cart-head.flash { animation:cart-flash .35s ease-out; }

/* ── Customization Modal ─────────────────────────────────────────────────── */
#cust-modal { position:fixed; inset:0; background:rgba(0,0,0,.48); z-index:400;
  display:none; align-items:center; justify-content:center; padding:16px; }
#cust-modal.on { display:flex; }
.modal-card { background:var(--white); border-radius:16px;
  max-width:520px; width:100%; max-height:90vh;
  display:flex; flex-direction:column; overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.22); }
.modal-hd { padding:16px 20px 13px; border-bottom:1px solid var(--border);
  display:flex; align-items:flex-start; justify-content:space-between;
  gap:12px; flex-shrink:0; }
.modal-pname { font-family:'Cormorant Garamond',serif; font-size:20px;
  color:var(--g-dark); letter-spacing:.04em; line-height:1.3; }
.modal-pzh   { font-size:11px; color:var(--gray); margin-top:3px; }
.modal-x { background:transparent; border:none; color:#bbb; cursor:pointer;
  font-size:22px; line-height:1; padding:2px 4px; flex-shrink:0; margin-top:1px;
  transition:color .15s; }
.modal-x:hover { color:var(--ink); }
.modal-body { flex:1; overflow-y:auto; padding:16px 20px; }
.msec  { margin-bottom:20px; }
.mlbl  { font-size:10px; letter-spacing:.22em; text-transform:uppercase;
  color:var(--gray); display:block; margin-bottom:10px; }
.mopts { display:flex; flex-wrap:wrap; gap:7px; }
.mopt  { padding:10px 16px; border:1.5px solid rgba(107,143,113,.22);
  border-radius:8px; background:transparent; font-family:'Jost',sans-serif;
  font-size:13px; color:var(--gray); cursor:pointer; transition:all .15s; min-width:70px; text-align:center; }
.mopt:hover { border-color:var(--g-mid); color:var(--g-dark); }
.mopt.on { background:var(--g-dark); color:var(--cream); border-color:var(--g-dark); }
.mopt .msub { font-size:10px; display:block; margin-top:2px; opacity:.72; }
.mincl { font-size:13px; color:var(--g-mid); padding:8px 2px; }
.mtopping { display:flex; align-items:center; justify-content:space-between;
  padding:12px 14px; border:1.5px solid rgba(107,143,113,.18); border-radius:10px;
  cursor:pointer; transition:all .15s; margin-bottom:8px; }
.mtopping:hover { border-color:var(--g-mid); }
.mtopping.on { border-color:var(--g-dark); background:rgba(45,74,62,.04); }
.mt-name { font-family:'Cormorant Garamond',serif; font-size:15px; color:var(--ink); }
.mt-right { display:flex; align-items:center; gap:10px; }
.mt-price { font-size:12px; color:var(--gray); }
.mt-chk   { width:22px; height:22px; border-radius:50%;
  border:1.5px solid rgba(107,143,113,.28); display:flex; align-items:center;
  justify-content:center; font-size:12px; color:transparent; transition:all .15s; }
.mtopping.on .mt-chk { background:var(--g-dark); border-color:var(--g-dark); color:var(--cream); }
.modal-ft { border-top:1px solid var(--border); padding:13px 20px;
  display:flex; align-items:center; gap:11px; flex-shrink:0; background:var(--white); }
.mf-qty  { display:flex; align-items:center; background:var(--bg);
  border-radius:10px; border:1px solid rgba(107,143,113,.18); overflow:hidden; flex-shrink:0; }
.mf-qb   { background:transparent; border:none; font-size:22px; color:var(--g-dark);
  cursor:pointer; width:40px; height:48px; display:flex; align-items:center;
  justify-content:center; transition:background .14s; }
.mf-qb:hover { background:rgba(45,74,62,.1); }
.mf-qn   { font-family:'Cormorant Garamond',serif; font-size:20px; color:var(--g-dark);
  min-width:32px; text-align:center; }
.mf-add  { flex:1; background:var(--g-dark); color:var(--cream); border:none;
  border-radius:10px; padding:14px 12px; font-family:'Cormorant Garamond',serif;
  font-size:16px; letter-spacing:.05em; cursor:pointer; transition:all .18s; white-space:nowrap; }
.mf-add:hover { background:#1e3329; }

/* ── Success Overlay ─────────────────────────────────────────────────────── */
#success-screen { position:fixed; inset:0; background:rgba(45,74,62,.96);
  display:none; align-items:center; justify-content:center; z-index:500; }
#success-screen.on { display:flex; }
.scard { background:var(--cream); border-radius:20px; padding:44px 52px;
  text-align:center; max-width:380px; width:90%; }
.sicon { width:64px; height:64px; border:2px solid var(--g-mid); border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:28px; color:var(--g-dark); margin:0 auto 20px; }
.slbl  { font-size:10px; letter-spacing:.3em; text-transform:uppercase; color:var(--gray); margin-bottom:12px; }
.snum  { font-family:'Cormorant Garamond',serif; font-size:54px; font-weight:300;
  color:var(--g-dark); letter-spacing:.1em; line-height:1; }
.snumlbl { font-size:9px; letter-spacing:.28em; text-transform:uppercase;
  color:var(--gray); margin-top:4px; margin-bottom:18px; }
.spay  { display:inline-block; font-size:13px; color:var(--g-dark);
  background:rgba(45,74,62,.08); border:1px solid rgba(107,143,113,.28);
  padding:6px 18px; border-radius:20px; margin-bottom:28px; }
.snew  { background:var(--g-dark); color:var(--cream); border:none;
  border-radius:10px; padding:14px 42px; font-family:'Cormorant Garamond',serif;
  font-size:17px; letter-spacing:.08em; cursor:pointer; transition:all .18s; }
.snew:hover { background:#1e3329; }

/* ── Toast ───────────────────────────────────────────────────────────────── */
#toast { position:fixed; bottom:28px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--cream); padding:10px 22px;
  border-radius:8px; font-size:13px; letter-spacing:.06em;
  opacity:0; transition:opacity .28s; z-index:9000;
  pointer-events:none; white-space:nowrap; max-width:90vw; }
</style>
</head>
<body>

<!-- ── PIN Screen ─────────────────────────────────────────────────────────── -->
<div id="pin-screen">
  <div class="pin-logo">White Leaf</div>
  <div class="pin-sub">Counter POS</div>
  <input id="pin-inp" class="pin-input" type="password" inputmode="numeric"
         placeholder="Enter PIN" maxlength="8" autocomplete="off">
  <button id="pin-btn" class="pin-btn" onclick="doLogin()">Sign In</button>
  <div id="pin-err" class="pin-error"></div>
</div>

<!-- ── POS App ────────────────────────────────────────────────────────────── -->
<div id="pos-app">

  <!-- Top bar -->
  <div class="topbar">
    <div class="topbar-logo">
      <span class="topbar-name">White Leaf</span>
      <span class="topbar-badge">Counter POS</span>
    </div>
    <button class="topbar-logout" onclick="doLogout()">Sign Out</button>
  </div>

  <!-- Body: 3 columns -->
  <div class="pos-body">

    <!-- Col 1: Category Sidebar -->
    <div class="cat-col" id="cat-col"></div>

    <!-- Col 2: Product Panel -->
    <div class="prod-panel">
      <div class="prod-header" id="prod-header">
        <div class="prod-header-title" id="prod-title"></div>
        <div class="prod-header-desc"  id="prod-desc"></div>
      </div>
      <div class="prod-grid" id="prod-grid"></div>
    </div>

    <!-- Col 3: Cart -->
    <div class="cart-panel">
      <div class="cart-head" id="cart-head">
        <div class="cart-head-left">
          <span class="cart-title">Order</span>
          <span class="cart-badge" id="cart-badge"></span>
        </div>
        <button class="cart-clear" onclick="clearCart()">Clear All</button>
      </div>
      <div class="cart-list" id="cart-list">
        <div class="cart-empty">Select items from the menu</div>
      </div>
      <div class="cart-foot">
        <div class="cf-row">
          <span>Subtotal</span><span id="cf-sub">0 Ft</span>
        </div>
        <div class="cf-disc" id="cf-disc">
          <span>Student Discount</span><span>−200 Ft</span>
        </div>
        <div class="cf-total">
          <span class="cf-tlbl">Total</span>
          <span class="cf-tval" id="cf-total">0 Ft</span>
        </div>
        <div class="cf-student">
          <label class="cf-slbl">
            <input type="checkbox" id="student-chk" onchange="toggleStudent()">
            Student Discount
          </label>
          <span class="cf-sbadge" id="student-badge">−200 Ft</span>
        </div>
        <input id="order-notes" class="cf-notes" type="text" placeholder="Staff notes (optional)">
        <div class="cf-pay">
          <button class="cf-pbtn on" id="pay-cash" onclick="setPay('cash')">💵 Cash</button>
          <button class="cf-pbtn"    id="pay-card" onclick="setPay('card')">💳 Card</button>
        </div>
        <button class="cf-submit" id="cf-submit" onclick="submitOrder()" disabled>
          Place Order
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ── Customization Modal ────────────────────────────────────────────────── -->
<div id="cust-modal" onclick="modalBgClick(event)">
  <div class="modal-card">
    <div class="modal-hd">
      <div>
        <div class="modal-pname" id="m-pname"></div>
        <div class="modal-pzh"   id="m-pzh"></div>
      </div>
      <button class="modal-x" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="m-body"></div>
    <div class="modal-ft">
      <div class="mf-qty">
        <button class="mf-qb" onclick="mQty(-1)">−</button>
        <span   class="mf-qn" id="m-qty">1</span>
        <button class="mf-qb" onclick="mQty(+1)">+</button>
      </div>
      <button class="mf-add" id="m-add" onclick="commitItem()"></button>
    </div>
  </div>
</div>

<!-- ── Success Screen ─────────────────────────────────────────────────────── -->
<div id="success-screen">
  <div class="scard">
    <div class="sicon">✓</div>
    <div class="slbl">Order Placed</div>
    <div class="snum"    id="s-num"></div>
    <div class="snumlbl">Order Number</div>
    <div class="spay"    id="s-pay"></div>
    <button class="snew" onclick="newOrder()">New Order</button>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
'use strict';

/* ── Constants ────────────────────────────────────────────────────────────── */
var API = 'https://whiteleaf-backend-production.up.railway.app';

var MENU = [
  { id:'pmt', name:'Pearl Milk Tea', desc:'Tapioca pearls or coconut jelly · Small or Large',

var SLUSH_TPS = [
  { id:'tp-pearl',   name:'Tapioca Pearls', price:300 },
  { id:'tp-coconut', name:'Coconut Jelly',  price:300 },
  { id:'tp-boba',    name:'Popping Boba',   price:300 },

/* ── App State ────────────────────────────────────────────────────────────── */
var token       = localStorage.getItem('wl_counter_token') || '';
var cart        = [];
var curCat      = 0;
var studentOn   = false;
var payType     = 'cash';

// Modal state
var mProd       = null;   // product being configured
var mEditIdx    = -1;     // -1 = new item, ≥0 = editing cart[mEditIdx]
var mSize       = '';
var mSweet      = '50%';
var mIce        = 'Normal';
var mBase       = '';     // 'popping-boba' | 'coconut-jelly'
var mSlushTops  = {};     // { 'tp-pearl': true }
var mQtyVal     = 1;

/* ── Auth ─────────────────────────────────────────────────────────────────── */
async function doLogin() {
  var pin   = document.getElementById('pin-inp').value.trim();
  var err   = document.getElementById('pin-err');
  var btn   = document.getElementById('pin-btn');
  if (!pin) { err.textContent = 'Please enter PIN'; return; }
  btn.disabled = true; err.textContent = '';
  try {
    var r    = await fetch(API + '/api/admin/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ pin: pin })
    });
    var data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Incorrect PIN');
    token = data.token;
    localStorage.setItem('wl_counter_token', token);
    launchPOS();
  } catch(e) {
    err.textContent = 'Incorrect PIN — please try again';
    document.getElementById('pin-inp').value = '';
    document.getElementById('pin-inp').focus();
  } finally { btn.disabled = false; }
}

function doLogout() {
  token = ''; localStorage.removeItem('wl_counter_token');
  document.getElementById('pos-app').classList.remove('on');
  document.getElementById('pin-screen').style.display = 'flex';
  document.getElementById('pin-inp').value = '';
  document.getElementById('pin-err').textContent = '';
}

function launchPOS() {
  document.getElementById('pin-screen').style.display = 'none';
  document.getElementById('pos-app').classList.add('on');
  resetState();
  renderCats();
  selectCat(0);
}

// Auto-login if stored token valid
(async function() {
  if (!token) return;
  try {
    var r = await fetch(API + '/api/admin/orders?limit=1', {
      headers:{ 'Authorization':'Bearer ' + token }
    });
    if (r.ok) { launchPOS(); }
    else { localStorage.removeItem('wl_counter_token'); token = ''; }
  } catch(e) {}
})();

/* ── POS Init ─────────────────────────────────────────────────────────────── */
function resetState() {
  cart = []; studentOn = false; payType = 'cash'; mQtyVal = 1;
  document.getElementById('student-chk').checked = false;
  document.getElementById('order-notes').value = '';
  document.getElementById('pay-cash').classList.add('on');
  document.getElementById('pay-card').classList.remove('on');
}

/* ── Category Rendering ───────────────────────────────────────────────────── */
function renderCats() {
  document.getElementById('cat-col').innerHTML = MENU.map(function(cat, i) {
    return '<div class="cat-item' + (i === curCat ? ' active' : '') +
      '" onclick="selectCat(' + i + ')">' +
      '<div class="cat-name">' + cat.name + '</div>' +
      '<div class="cat-cnt">' + cat.items.length + ' drinks</div>' +
      '</div>';
  }).join('');
}

function selectCat(i) {
  curCat = i;
  renderCats();
  var cat = MENU[i];
  document.getElementById('prod-title').textContent = cat.name;
  document.getElementById('prod-desc').textContent  = cat.desc;
  renderProds(cat.items);
}

/* ── Product Rendering ────────────────────────────────────────────────────── */
function renderProds(items) {
  document.getElementById('prod-grid').innerHTML = items.map(function(p) {
    var vals = Object.values(p.prices);
    var lo   = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    var prStr = lo === hi ? fmt(lo) : fmt(lo) + ' – ' + fmt(hi);
    return '<button class="prod-btn" onclick="openModal(\'' + p.id + '\')">' +
      '<div><div class="pb-name">' + p.name + '</div>' +
      '<div class="pb-zh">'   + p.zh   + '</div></div>' +
      '<div class="pb-price">' + prStr + ' Ft</div>' +
      '</button>';
  }).join('');
}

/* ── Modal: Open / Close ──────────────────────────────────────────────────── */
function findProd(id) {
  for (var c = 0; c < MENU.length; c++)
    for (var p = 0; p < MENU[c].items.length; p++)
      if (MENU[c].items[p].id === id) return MENU[c].items[p];
  return null;
}

function openModal(productId) {
  mProd     = findProd(productId);
  mEditIdx  = -1;
  if (!mProd) return;

  // Defaults
  var sizes = Object.keys(mProd.prices);
  mSize     = sizes[sizes.length - 1];   // prefer Large
  mSweet    = '50%';
  mIce      = 'Normal';
  mBase     = (mProd.base === 'fruittea' || mProd.base === 'fruitmilk') ? 'popping-boba' : '';
  mSlushTops = {};
  mQtyVal   = 1;

  renderModal();
  document.getElementById('cust-modal').classList.add('on');
}

function openModalEdit(idx) {
  var item  = cart[idx];
  mProd     = findProd(item.productId);
  mEditIdx  = idx;
  if (!mProd) return;

  mSize      = item.size;
  mSweet     = item.sweetness || '50%';
  mIce       = item.ice       || 'Normal';
  mBase      = item.baseChoice;
  mSlushTops = {};
  item.paidToppings.forEach(function(t) { mSlushTops[t.id] = true; });
  mQtyVal    = item.quantity;

  renderModal();
  document.getElementById('cust-modal').classList.add('on');
}

function closeModal() {
  document.getElementById('cust-modal').classList.remove('on');
}

function modalBgClick(e) {
  if (e.target === document.getElementById('cust-modal')) closeModal();
}

/* ── Modal: Render Body ───────────────────────────────────────────────────── */
function renderModal() {
  var p = mProd;
  document.getElementById('m-pname').textContent = p.name;
  document.getElementById('m-pzh').textContent   = p.zh;
  document.getElementById('m-qty').textContent   = mQtyVal;

  var html = '';

  // Size
  var sizes = Object.keys(p.prices);
  if (sizes.length > 1) {
    html += '<div class="msec"><span class="mlbl">Size</span><div class="mopts">';
    sizes.forEach(function(sz) {
      html += '<button class="mopt' + (sz === mSize ? ' on' : '') +
        '" onclick="mSetSize(\'' + sz + '\')">' + sz +
        '<span class="msub">' + fmt(p.prices[sz]) + ' Ft</span></button>';
    });
    html += '</div></div>';
  }

  // Sweetness + Ice (not for slush)
  if (p.base !== 'slush') {
    html += '<div class="msec"><span class="mlbl">Sweetness</span><div class="mopts">';
    ['0%','30%','50%','70%','100%'].forEach(function(sw) {
      html += '<button class="mopt' + (sw === mSweet ? ' on' : '') +
        '" onclick="mSetSweet(\'' + sw + '\')">' + sw + '</button>';
    });
    html += '</div></div>';

    html += '<div class="msec"><span class="mlbl">Ice Level</span><div class="mopts">';
    ['No Ice','Less Ice','Normal','Extra Ice'].forEach(function(ic) {
      html += '<button class="mopt' + (ic === mIce ? ' on' : '') +
        '" onclick="mSetIce(\'' + ic + '\')">' + ic + '</button>';
    });
    html += '</div></div>';
  }

  // Base choice for fruit tea / milk tea
  if (p.base === 'fruittea' || p.base === 'fruitmilk') {
    html += '<div class="msec"><span class="mlbl">Base Topping — Included</span><div class="mopts">';
    [['popping-boba','Popping Boba'],['coconut-jelly','Coconut Jelly']].forEach(function(pair) {
      html += '<button class="mopt' + (mBase === pair[0] ? ' on' : '') +
        '" style="min-width:128px" onclick="mSetBase(\'' + pair[0] + '\')">' + pair[1] + '</button>';
    });
    html += '</div></div>';
  }

  // Fixed base notice
  if (p.base === 'pearl-fixed') {
    html += '<div class="msec"><span class="mlbl">Included</span>' +
      '<div class="mincl">Tapioca Pearls — included</div></div>';
  }
  if (p.base === 'coconut-fixed') {
    html += '<div class="msec"><span class="mlbl">Included</span>' +
      '<div class="mincl">Coconut Jelly — included</div></div>';
  }

  // Paid toppings for slush
  if (p.base === 'slush') {
    html += '<div class="msec"><span class="mlbl">Add-ons (+300 Ft each)</span>';
    SLUSH_TPS.forEach(function(tp) {
      var sel = !!mSlushTops[tp.id];
      html += '<div class="mtopping' + (sel ? ' on' : '') +
        '" onclick="mToggleTp(\'' + tp.id + '\')">' +
        '<span class="mt-name">' + tp.name + '</span>' +
        '<div class="mt-right"><span class="mt-price">+' + fmt(tp.price) + ' Ft</span>' +
        '<div class="mt-chk">' + (sel ? '✓' : '') + '</div></div></div>';
    });
    html += '</div>';
  }

  document.getElementById('m-body').innerHTML = html;
  updateModalBtn();
}

function mSetSize(sz)  { mSize = sz;  renderModal(); }
function mSetSweet(sw) { mSweet = sw; renderModal(); }
function mSetIce(ic)   { mIce = ic;   renderModal(); }
function mSetBase(b)   { mBase = b;   renderModal(); }
function mToggleTp(id) { mSlushTops[id] = !mSlushTops[id]; renderModal(); }
function mQty(d) {
  mQtyVal = Math.max(1, Math.min(20, mQtyVal + d));
  document.getElementById('m-qty').textContent = mQtyVal;
  updateModalBtn();
}

function getTpTotal() {
  var t = 0;
  if (mProd && mProd.base === 'slush')
    SLUSH_TPS.forEach(function(tp) { if (mSlushTops[tp.id]) t += tp.price; });
  return t;
}

function updateModalBtn() {
  var unitPrice = mProd.prices[mSize] + getTpTotal();
  var total = unitPrice * mQtyVal;
  var isEdit = mEditIdx >= 0;
  document.getElementById('m-add').textContent =
    (isEdit ? 'Update — ' : 'Add to Order — ') + fmt(total) + ' Ft';
}

/* ── Modal: Commit (Add or Update) ───────────────────────────────────────── */
function commitItem() {
  var p = mProd;

  // Resolve baseChoice
  var baseChoice = p.base;
  var freeTop    = null;
  if (p.base === 'pearl-fixed') {
    freeTop = { id:'tp-pearl',   name:'Tapioca Pearls', price:0, isFree:true };
  } else if (p.base === 'coconut-fixed') {
    freeTop = { id:'tp-coconut', name:'Coconut Jelly',  price:0, isFree:true };
  } else if (p.base === 'fruittea' || p.base === 'fruitmilk') {
    baseChoice = mBase;
    freeTop = mBase === 'popping-boba'
      ? { id:'tp-boba',    name:'Popping Boba',  price:0, isFree:true }
      : { id:'tp-coconut', name:'Coconut Jelly', price:0, isFree:true };
  }

  // Paid slush toppings
  var paidTops = [], tpTotal = 0;
  if (p.base === 'slush') {
    SLUSH_TPS.forEach(function(tp) {
      if (mSlushTops[tp.id]) { paidTops.push({ id:tp.id, name:tp.name, price:tp.price, isFree:false }); tpTotal += tp.price; }
    });
  }

  var newItem = {
    uid:          Date.now() + '' + Math.random(),
    productId:    p.id,
    name:         p.name,
    nameZh:       p.zh,
    size:         mSize,
    sweetness:    p.base !== 'slush' ? mSweet : null,
    ice:          p.base !== 'slush' ? mIce   : null,
    baseChoice:   baseChoice,
    freeTop:      freeTop,
    paidToppings: paidTops,
    tpTotal:      tpTotal,
    unitPrice:    p.prices[mSize],
    quantity:     mQtyVal
  };

  if (mEditIdx >= 0) {
    cart.splice(mEditIdx, 1, newItem);
  } else {
    cart.push(newItem);
    // Flash cart header to confirm addition
    var h = document.getElementById('cart-head');
    h.classList.remove('flash');
    void h.offsetWidth;
    h.classList.add('flash');
  }

  closeModal();
  renderCart();
}

/* ── Cart ─────────────────────────────────────────────────────────────────── */
function renderCart() {
  var list = document.getElementById('cart-list');
  if (cart.length === 0) {
    list.innerHTML = '<div class="cart-empty">Select items from the menu</div>';
    document.getElementById('cart-badge').textContent = '';
  } else {
    var totalQty = cart.reduce(function(s, it) { return s + it.quantity; }, 0);
    document.getElementById('cart-badge').textContent =
      totalQty + (totalQty === 1 ? ' item' : ' items');

    list.innerHTML = cart.map(function(item, idx) {
      var parts = [];
      if (item.size) parts.push(item.size);
      if (item.sweetness) parts.push(item.sweetness);
      if (item.ice) parts.push(item.ice);
      if (item.freeTop) parts.push(item.freeTop.name);
      item.paidToppings.forEach(function(t) { parts.push('+' + t.name); });
      var lineTotal = (item.unitPrice + item.tpTotal) * item.quantity;

      return '<div class="ci">' +
        '<div class="ci-info">' +
          '<div class="ci-name">' + item.name + '</div>' +
          '<div class="ci-detail">' + parts.join(' · ') + '</div>' +
          '<div class="ci-qty-row">' +
            '<button class="ci-qb" onclick="cartQty(' + idx + ',-1)">−</button>' +
            '<span class="ci-qn">' + item.quantity + '</span>' +
            '<button class="ci-qb" onclick="cartQty(' + idx + ',1)">+</button>' +
          '</div>' +
        '</div>' +
        '<div class="ci-right">' +
          '<div class="ci-price">' + fmt(lineTotal) + ' Ft</div>' +
          '<div class="ci-acts">' +
            '<button class="ci-edit" onclick="openModalEdit(' + idx + ')" title="Edit">✏</button>' +
            '<button class="ci-del"  onclick="removeItem(' + idx + ')"   title="Remove">×</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }
  updateTotals();
}

function cartQty(idx, d) {
  var newQty = cart[idx].quantity + d;
  if (newQty < 1) { removeItem(idx); return; }
  cart[idx].quantity = Math.min(20, newQty);
  renderCart();
}

function removeItem(idx) {
  cart.splice(idx, 1);
  renderCart();
}

function clearCart() {
  if (cart.length === 0) return;
  if (!confirm('Clear all items from this order?')) return;
  cart = []; studentOn = false;
  document.getElementById('student-chk').checked = false;
  renderCart();
}

function updateTotals() {
  var sub    = cart.reduce(function(s, it) { return s + (it.unitPrice + it.tpTotal) * it.quantity; }, 0);
  var disc   = (studentOn && sub > 0) ? 200 : 0;
  var total  = Math.max(0, sub - disc);
  document.getElementById('cf-sub').textContent   = fmt(sub) + ' Ft';
  document.getElementById('cf-total').textContent = fmt(total) + ' Ft';
  var dr = document.getElementById('cf-disc');
  if (disc) dr.classList.add('on'); else dr.classList.remove('on');
  var sb = document.getElementById('student-badge');
  if (studentOn) sb.classList.add('on'); else sb.classList.remove('on');
  document.getElementById('cf-submit').disabled = cart.length === 0;
}

function toggleStudent() {
  studentOn = document.getElementById('student-chk').checked;
  updateTotals();
}

function setPay(type) {
  payType = type;
  document.getElementById('pay-cash').classList.toggle('on', type === 'cash');
  document.getElementById('pay-card').classList.toggle('on', type === 'card');
}

/* ── Submit Order ─────────────────────────────────────────────────────────── */
async function submitOrder() {
  if (cart.length === 0) return;
  var btn = document.getElementById('cf-submit');
  btn.disabled = true;
  btn.textContent = 'Placing…';

  // Build items array
  var items = cart.map(function(it) {
    return {
      productId:   it.productId,
      name:        it.name,
      nameZh:      it.nameZh,
      size:        it.size,
      baseChoice:  it.baseChoice,
      bobaFlavour: null,
      quantity:    it.quantity,
      unitPrice:   it.unitPrice,
      sweetness:   it.sweetness,
      ice:         it.ice,
      isFree:      false
    };
  });

  // Paid toppings only (free base inclusions are in baseChoice on each item)
  var toppings = [];
  cart.forEach(function(it) { it.paidToppings.forEach(function(t) { toppings.push(t); }); });

  var note = document.getElementById('order-notes').value.trim();
  var notes = '[' + (payType === 'cash' ? 'Cash' : 'Card') + ']' + (note ? ' ' + note : '');

  try {
    var r = await fetch(API + '/api/orders', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + token },
      body: JSON.stringify({
        items:          items,
        toppings:       toppings,
        sweetness:      null,
        ice:            null,
        notes:          notes,
        paymentMethod:  'counter',
        lang:           'en',
        studentDiscount: studentOn
      })
    });
    if (r.status === 401 || r.status === 403) { doLogout(); return; }
    var data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Request failed');
    showSuccess(data.orderNumber);
  } catch(e) {
    showToast('Failed: ' + e.message);
    btn.disabled  = false;
    btn.textContent = 'Place Order';
  }
}

function showSuccess(orderNumber) {
  document.getElementById('s-num').textContent =
    '#' + orderNumber;
  document.getElementById('s-pay').textContent =
    payType === 'cash' ? '💵 Paid by Cash' : '💳 Paid by Card';
  document.getElementById('success-screen').classList.add('on');
}

function newOrder() {
  document.getElementById('success-screen').classList.remove('on');
  resetState();
  renderCart();
  // stay on current category
}

/* ── Utils ────────────────────────────────────────────────────────────────── */
function fmt(n) {
  try { return Number(n).toLocaleString('hu-HU'); }
  catch(e) { return String(Number(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' '); }
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.style.opacity = '1';
  clearTimeout(t._t);
  t._t = setTimeout(function() { t.style.opacity = '0'; }, 3200);
}

/* ── Keyboard ─────────────────────────────────────────────────────────────── */
document.getElementById('pin-inp').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
});

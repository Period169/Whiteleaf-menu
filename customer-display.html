<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>White Leaf — Customer Display</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: #fff;
  font-family: 'Jost', system-ui, sans-serif;
  font-weight: 300;
  color: #1a1a1a;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

#display {
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Empty state ──────────────────────────────────────────────────────────── */
#empty {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 44px;
  font-weight: 200;
  color: #ccc;
  letter-spacing: 0.01em;
}

/* ── Items scroll container ───────────────────────────────────────────────── */
#items {
  flex: 1;
  overflow: hidden;
  padding: 28px 60px 140px;   /* bottom pad keeps content above fixed totals */
  display: none;
}

/* Animatable inner wrapper — duplicated for seamless scroll loop */
#scroll-inner { will-change: transform; }

@keyframes scroll-up {
  0%   { transform: translateY(0); }
  100% { transform: translateY(-50%); }
}

/* ── Item card ────────────────────────────────────────────────────────────── */
.item {
  padding: 13px 0;
  border-bottom: 1px solid #efefef;
}
.item:last-child { border-bottom: none; }

/* Row 1 — name (left) + price (right) */
.item-row1 {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 16px;
  margin-bottom: 3px;
}
.item-name {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 28px;
  font-weight: 700;
  color: #1a1a1a;
  line-height: 1.15;
}
.item-price {
  font-size: 24px;
  font-weight: 700;
  color: #1a1a1a;
  white-space: nowrap;
  flex-shrink: 0;
}

/* Row 2 — Size · Sugar · Ice */
.item-row2 {
  font-size: 14px;
  color: #bbb;
  line-height: 1.5;
}

/* Row 3 — Toppings × Qty */
.item-row3 {
  font-size: 14px;
  color: #2d4a3e;
  line-height: 1.5;
}

/* ── Debug bar (bottom-left, unobtrusive) ─────────────────────────────────── */
#dbg-bar {
  position: fixed;
  bottom: 0; left: 0;
  padding: 5px 12px;
  font-size: 11px;
  font-family: monospace;
  color: #ccc;
  background: rgba(255,255,255,.8);
  border-top-right-radius: 6px;
  pointer-events: none;
  z-index: 999;
}
#dbg-bar.live { color: #27ae60; }

/* ── Totals — fixed bottom-right ─────────────────────────────────────────── */
#totals {
  position: fixed;
  bottom: 0; right: 0;
  padding: 14px 40px 20px 32px;
  background: #fff;
  border-top: 1px solid #eee;
  border-left: 1px solid #eee;
  border-top-left-radius: 10px;
  text-align: right;
  display: none;
  z-index: 100;
  min-width: 260px;
}

.tot-sub {
  display: flex;
  justify-content: space-between;
  gap: 28px;
  font-size: 15px;
  color: #bbb;
  margin-bottom: 2px;
}
.tot-disc {
  display: flex;
  justify-content: space-between;
  gap: 28px;
  font-size: 15px;
  color: #27ae60;
  margin-bottom: 2px;
}
.tot-total {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 28px;
  margin-top: 6px;
}
.tot-tlbl {
  font-size: 13px;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: #bbb;
}
.tot-tval {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 58px;
  font-weight: 400;
  color: #2d4a3e;
  line-height: 1;
}
</style>
</head>
<body>

<div id="display">
  <div id="empty">Please place your order.</div>
  <div id="items"><div id="scroll-inner"></div></div>
  <div id="totals"></div>
</div>
<div id="dbg-bar">⚪ waiting for POS…</div>

<script>
'use strict';

var ch = typeof BroadcastChannel !== 'undefined'
  ? new BroadcastChannel('wl_customer_display') : null;

function fmt(n) {
  try { return Number(n).toLocaleString('hu-HU'); }
  catch(e) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
}

function render(data) {
  var elEmpty  = document.getElementById('empty');
  var elItems  = document.getElementById('items');
  var elInner  = document.getElementById('scroll-inner');
  var elTotals = document.getElementById('totals');

  if (!data || !data.items || data.items.length === 0) {
    elEmpty.style.display  = 'flex';
    elItems.style.display  = 'none';
    elTotals.style.display = 'none';
    elInner.style.animation = 'none';
    elInner.innerHTML = '';
    return;
  }

  elEmpty.style.display  = 'none';
  elItems.style.display  = 'block';
  elTotals.style.display = 'block';

  var itemsHtml = data.items.map(function(it) {
    var unitTotal = it.unitPrice + it.tpTotal;

    /* Row 1: name + per-item price */
    var html = '<div class="item">'
      + '<div class="item-row1">'
      + '<span class="item-name">' + it.name + '</span>'
      + '<span class="item-price">' + fmt(unitTotal) + ' Ft</span>'
      + '</div>';

    /* Row 2: Size · Sugar · Ice (only non-empty fields) */
    var details = [];
    if (it.size)      details.push(it.size);
    if (it.sweetness) details.push(it.sweetness + ' Sugar');
    if (it.ice)       details.push(it.ice === 'Normal' ? 'Normal Ice' : it.ice);
    if (details.length) {
      html += '<div class="item-row2">' + details.join(' · ') + '</div>';
    }

    /* Row 3: Toppings × Qty */
    var tops = [];
    if (it.freeTop)                                tops.push(it.freeTop);
    if (it.paidToppings && it.paidToppings.length) tops = tops.concat(it.paidToppings);
    var row3 = tops.map(function(t){ return '+ ' + t; }).join(' · ');
    if (it.quantity > 1) row3 += (row3 ? ' ' : '') + '×' + it.quantity;
    if (row3) html += '<div class="item-row3">' + row3 + '</div>';

    html += '</div>';
    return html;
  }).join('');

  /* Stop any running animation, render one set first */
  elInner.style.animation = 'none';
  elInner.innerHTML = itemsHtml;

  /* After paint: check if scroll is needed */
  setTimeout(function() {
    var viewH    = elItems.clientHeight;
    var contentH = elInner.scrollHeight;
    if (contentH > viewH) {
      elInner.innerHTML = itemsHtml + itemsHtml;          /* duplicate for seamless loop */
      var dur = (elInner.scrollHeight / 2) / 50 + 's';   /* 50 px/s — slow scroll */
      elInner.style.animation = 'scroll-up ' + dur + ' linear infinite';
    }
  }, 80);

  /* Totals */
  var tHtml = '<div class="tot-sub"><span>Subtotal</span><span>' + fmt(data.subtotal) + ' Ft</span></div>';
  if (data.discount > 0) {
    tHtml += '<div class="tot-disc"><span>Student Discount</span><span>−' + fmt(data.discount) + ' Ft</span></div>';
  }
  tHtml += '<div class="tot-total">'
    + '<span class="tot-tlbl">Total</span>'
    + '<span class="tot-tval">' + fmt(data.total) + ' Ft</span>'
    + '</div>';
  elTotals.innerHTML = tHtml;
}

console.log('[DISPLAY] origin:', window.location.origin);
console.log('[DISPLAY] BroadcastChannel:', ch ? 'OK — wl_customer_display' : 'NOT SUPPORTED');

function dbgStatus(msg, live) {
  var el = document.getElementById('dbg-bar');
  if (!el) return;
  el.textContent = msg;
  el.className = live ? 'live' : '';
}

var _gotCart = false;
var _lastFP  = null;

function _onCartData(data) {
  var fp = JSON.stringify(data.items) + ':' + data.total;
  _gotCart = true;
  if (fp === _lastFP) return;          /* skip re-render if cart unchanged */
  _lastFP = fp;
  var ts = new Date().toLocaleTimeString('en-GB', { hour12: false });
  var n  = data.items ? data.items.length : 0;
  console.log('[DISPLAY received]', n, 'item(s) at', ts, data);
  dbgStatus('● LIVE — ' + n + ' item(s) — ' + ts, true);
  render(data);
}

if (ch) {
  ch.onmessage = function(e) {
    console.log('[DISPLAY] channel message:', e.data);
    if (e.data && e.data.type === 'cart') _onCartData(e.data);
  };
}

/* 每秒：localStorage 备用读取 + BroadcastChannel 重试（直到收到为止） */
function _syncLoop() {
  try {
    var raw = localStorage.getItem('wl_cd_cart');
    if (raw) { var d = JSON.parse(raw); if (d && d.type === 'cart') _onCartData(d); }
  } catch(_) {}

  if (ch && !_gotCart) {
    dbgStatus('⚪ requesting from POS…', false);
    console.log('[DISPLAY] sending request to POS…');
    ch.postMessage({ type: 'request' });
  }
  setTimeout(_syncLoop, 1000);
}

if (!ch) dbgStatus('⚪ BroadcastChannel not supported — localStorage only', false);
_syncLoop();
</script>
</body>
</html>

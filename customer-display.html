<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>White Leaf — Customer Display</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: #fff;
  font-family: 'Jost', system-ui, sans-serif;
  font-weight: 300;
  color: #1a1a1a;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

#display {
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Empty state */
#empty {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 44px;
  font-weight: 200;
  color: #ccc;
  letter-spacing: 0.01em;
}

/* Items scroll container */
#items {
  flex: 1;
  overflow: hidden;
  padding: 28px 60px 140px;
  display: none;
}

/* Animatable inner wrapper */
#scroll-inner { will-change: transform; }

/* End-of-order marker */
.end-of-order {
  text-align: center;
  padding: 22px 0 10px;
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #ccc;
}

/* Item card */
.item {
  padding: 13px 0;
  border-bottom: 1px solid #efefef;
}
.item:last-child { border-bottom: none; }

/* Row 1: name (left) + price (right) */
.item-row1 {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 16px;
  margin-bottom: 3px;
}
.item-name {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 28px;
  font-weight: 700;
  color: #1a1a1a;
  line-height: 1.15;
}
.item-price {
  font-size: 24px;
  font-weight: 700;
  color: #1a1a1a;
  white-space: nowrap;
  flex-shrink: 0;
}

/* Row 2: Size / Sugar / Ice */
.item-row2 {
  font-size: 14px;
  color: #bbb;
  line-height: 1.5;
}

/* Row 3: Toppings x Qty */
.item-row3 {
  font-size: 14px;
  color: #2d4a3e;
  line-height: 1.5;
}

/* Debug bar (bottom-left) */
#dbg-bar {
  position: fixed;
  bottom: 0; left: 0;
  padding: 5px 12px;
  font-size: 11px;
  font-family: monospace;
  color: #ccc;
  background: rgba(255,255,255,.8);
  border-top-right-radius: 6px;
  pointer-events: none;
  z-index: 999;
}
#dbg-bar.live { color: #27ae60; }

/* Totals: fixed bottom-right */
#totals {
  position: fixed;
  bottom: 0; right: 0;
  padding: 14px 40px 20px 32px;
  background: #fff;
  border-top: 1px solid #eee;
  border-left: 1px solid #eee;
  border-top-left-radius: 10px;
  text-align: right;
  display: none;
  z-index: 100;
  min-width: 260px;
}

.tot-sub {
  display: flex;
  justify-content: space-between;
  gap: 28px;
  font-size: 15px;
  color: #bbb;
  margin-bottom: 2px;
}
.tot-disc {
  display: flex;
  justify-content: space-between;
  gap: 28px;
  font-size: 15px;
  color: #27ae60;
  margin-bottom: 2px;
}
.tot-total {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 28px;
  margin-top: 6px;
}
.tot-tlbl {
  font-size: 13px;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: #bbb;
}
.tot-tval {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 58px;
  font-weight: 400;
  color: #2d4a3e;
  line-height: 1;
}
</style>
</head>
<body>

<div id="display">
  <div id="empty">Please place your order.</div>
  <div id="items"><div id="scroll-inner"></div></div>
  <div id="totals"></div>
</div>
<div id="dbg-bar">&#9898; waiting for POS&#8230;</div>

<script>
'use strict';

var ch = typeof BroadcastChannel !== 'undefined'
  ? new BroadcastChannel('wl_customer_display') : null;

function fmt(n) {
  try { return Number(n).toLocaleString('hu-HU'); }
  catch(e) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
}

/* ── Auto-scroll: top pause → slow scroll down → bottom pause → instant reset ── */
var _sRAF = null;

function _stopScroll() {
  if (_sRAF) { cancelAnimationFrame(_sRAF); _sRAF = null; }
  var el = document.getElementById('scroll-inner');
  if (el) el.style.transform = '';
}

function _startScroll(el, maxPx) {
  _stopScroll();
  var SPEED     = 50;    /* px / second — slow */
  var PAUSE_TOP = 2000;  /* ms: hold at top before starting */
  var PAUSE_BOT = 3000;  /* ms: hold at bottom before instant reset */
  var phase = 'pause_top', phaseStart = null, offset = 0;

  function step(now) {
    if (phaseStart === null) phaseStart = now;
    var elapsed = now - phaseStart;

    if (phase === 'pause_top') {
      if (elapsed >= PAUSE_TOP) { phase = 'scrolling'; phaseStart = now; }

    } else if (phase === 'scrolling') {
      offset = Math.min(elapsed / 1000 * SPEED, maxPx);
      el.style.transform = 'translateY(-' + offset.toFixed(1) + 'px)';
      if (offset >= maxPx) { phase = 'pause_bottom'; phaseStart = now; }

    } else if (phase === 'pause_bottom') {
      if (elapsed >= PAUSE_BOT) {
        offset = 0;
        el.style.transform = '';    /* instant jump to top */
        phase = 'pause_top';
        phaseStart = now;
      }
    }
    _sRAF = requestAnimationFrame(step);
  }
  _sRAF = requestAnimationFrame(step);
}

/* ── Render ─────────────────────────────────────────────────────────────────── */
function render(data) {
  var elEmpty  = document.getElementById('empty');
  var elItems  = document.getElementById('items');
  var elInner  = document.getElementById('scroll-inner');
  var elTotals = document.getElementById('totals');
  _stopScroll();

  if (!data || !data.items || data.items.length === 0) {
    elEmpty.style.display  = 'flex';
    elItems.style.display  = 'none';
    elTotals.style.display = 'none';
    elInner.innerHTML = '';
    return;
  }

  elEmpty.style.display  = 'none';
  elItems.style.display  = 'block';
  elTotals.style.display = 'block';

  var itemsHtml = data.items.map(function(it) {
    var unitTotal = it.unitPrice + it.tpTotal;

    /* Row 1: name + unit price */
    var html = '<div class="item">'
      + '<div class="item-row1">'
      + '<span class="item-name">' + it.name + '</span>'
      + '<span class="item-price">' + fmt(unitTotal) + ' Ft</span>'
      + '</div>';

    /* Row 2: Size / Sugar / Ice */
    var details = [];
    if (it.size)      details.push(it.size);
    if (it.sweetness) details.push(it.sweetness + ' Sugar');
    if (it.ice)       details.push(it.ice === 'Normal' ? 'Normal Ice' : it.ice);
    if (details.length) html += '<div class="item-row2">' + details.join(' · ') + '</div>';

    /* Row 3: Toppings x Qty */
    var tops = [];
    if (it.freeTop)                                tops.push(it.freeTop);
    if (it.paidToppings && it.paidToppings.length) tops = tops.concat(it.paidToppings);
    var row3 = tops.map(function(t) { return '+ ' + t; }).join(' · ');
    if (it.quantity > 1) row3 += (row3 ? '  ' : '') + '×' + it.quantity;
    if (row3) html += '<div class="item-row3">' + row3 + '</div>';

    html += '</div>';
    return html;
  }).join('') + '<div class="end-of-order">— End of order —</div>';

  elInner.innerHTML = itemsHtml;

  /* After paint: scroll only when content exceeds visible area */
  setTimeout(function() {
    var PAD_TOP = 28, PAD_BOT = 140;
    var viewH    = elItems.clientHeight - PAD_TOP - PAD_BOT;
    var maxScroll = elInner.offsetHeight - viewH;
    if (maxScroll > 4) _startScroll(elInner, maxScroll);
  }, 80);

  /* Totals */
  var tHtml = '<div class="tot-sub"><span>Subtotal</span><span>' + fmt(data.subtotal) + ' Ft</span></div>';
  if (data.discount > 0) {
    tHtml += '<div class="tot-disc"><span>Student Discount</span><span>−' + fmt(data.discount) + ' Ft</span></div>';
  }
  tHtml += '<div class="tot-total">'
    + '<span class="tot-tlbl">Total</span>'
    + '<span class="tot-tval">' + fmt(data.total) + ' Ft</span>'
    + '</div>';
  elTotals.innerHTML = tHtml;
}

console.log('[DISPLAY] origin:', window.location.origin);
console.log('[DISPLAY] BroadcastChannel:', ch ? 'OK -- wl_customer_display' : 'NOT SUPPORTED');

function dbgStatus(msg, live) {
  var el = document.getElementById('dbg-bar');
  if (!el) return;
  el.textContent = msg;
  el.className = live ? 'live' : '';
}

/* ── Sync state ─────────────────────────────────────────────────────────────── */
var _gotCart = false;
var _lastFP  = null;

function _onCartData(data) {
  var fp = JSON.stringify(data.items) + ':' + data.total;
  _gotCart = true;
  if (fp === _lastFP) return;
  _lastFP = fp;
  var ts = new Date().toLocaleTimeString('en-GB', { hour12: false });
  var n  = data.items ? data.items.length : 0;
  console.log('[DISPLAY received]', n, 'item(s) at', ts, data);
  dbgStatus('● LIVE — ' + n + ' item(s) — ' + ts, true);
  render(data);
}

if (ch) {
  ch.onmessage = function(e) {
    console.log('[DISPLAY] channel message:', e.data);
    if (e.data && e.data.type === 'cart') _onCartData(e.data);
  };
}

/* Every 1s: localStorage fallback + BroadcastChannel retry until answered */
function _syncLoop() {
  try {
    var raw = localStorage.getItem('wl_cd_cart');
    if (raw) { var d = JSON.parse(raw); if (d && d.type === 'cart') _onCartData(d); }
  } catch(e) {}

  if (ch && !_gotCart) {
    dbgStatus('⚪ requesting from POS…', false);
    console.log('[DISPLAY] sending request to POS...');
    ch.postMessage({ type: 'request' });
  }
  setTimeout(_syncLoop, 1000);
}

if (!ch) dbgStatus('⚪ BroadcastChannel not supported -- localStorage only', false);
_syncLoop();
</script>
</body>
</html>
